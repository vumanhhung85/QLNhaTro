<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes">
<title>Mất kết nối — Nhà Trọ 187 NSHL</title>
<meta name="theme-color" content="#16233B">
<link rel="icon" type="image/png" href="logo_187_xanhla.png">
<style>
  :root{
    --cream:#FAF5E9;
    --navy:#16233B;
    --green:#00BF63;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--cream);
    color:var(--navy);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Be Vietnam Pro",Arial,sans-serif;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:380px;
    text-align:center;
  }
  .logo{
    width:96px;
    height:96px;
    border-radius:22px;
    margin:0 auto 24px;
    display:block;
    box-shadow:0 8px 24px rgba(22,35,59,0.15);
  }
  h1{
    font-size:20px;
    font-weight:700;
    margin:0 0 10px;
    color:var(--navy);
  }
  p{
    font-size:15px;
    line-height:1.5;
    color:#5b6472;
    margin:0 0 28px;
  }
  .dot{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#e0544a;
    margin-right:8px;
    vertical-align:middle;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:.35;}
  }
  button{
    appearance:none;
    border:none;
    background:var(--green);
    color:#fff;
    font-size:15px;
    font-weight:700;
    padding:14px 28px;
    border-radius:14px;
    cursor:pointer;
    width:100%;
    box-shadow:0 6px 16px rgba(0,191,99,0.35);
  }
  button:active{
    transform:scale(0.98);
  }
  .hint{
    margin-top:16px;
    font-size:13px;
    color:#8a93a0;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="icon-192.png" alt="Nhà Trọ 187" onerror="this.src='logo_187_xanhla.png'">
    <h1><span class="dot"></span>Mất kết nối Internet</h1>
    <p>Sổ Thu Tiền Nhà Trọ 187 cần kết nối mạng để tải dữ liệu phòng trọ. Vui lòng kiểm tra Wi‑Fi / 4G rồi thử lại.</p>
    <button onclick="location.reload()">🔄 Thử lại</button>
    <div class="hint" id="hint">Sẽ tự động vào lại app ngay khi có mạng…</div>
  </div>

<script>
// Tự tải lại ngay khi thiết bị có mạng trở lại — không cần anh bấm gì
window.addEventListener('online', function(){
  document.getElementById('hint').textContent = 'Đã có mạng, đang vào lại app…';
  setTimeout(function(){ location.reload(); }, 400);
});
</script>
</body>
</html>
