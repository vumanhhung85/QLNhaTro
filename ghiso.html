<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes">
<meta name="color-scheme" content="light">
<title>Ghi số cuối tháng — Nhà Trọ 187 NSHL</title>
<meta name="theme-color" content="#16233B">
<link rel="icon" type="image/png" href="logo_187_xanhla.png">
<style>
  :root{
    --cream:#FAF5E9;
    --navy:#16233B;
    --green:#00BF63;
    --green-dark:#0f6b3f;
    --red:#d9362e;
    --amber:#b76e00;
    --card:#ffffff;
    --border:#e7e0d0;
    --soft:#6b7280;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
    background:var(--cream);
    color:var(--navy);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Be Vietnam Pro",Arial,sans-serif;
  }
  body{
    padding:16px 14px 130px;
  }
  h1{font-size:19px; margin:0 0 4px;}
  h2{font-size:16px; margin:0 0 10px;}
  p{line-height:1.5; margin:0 0 12px; color:var(--soft);}
  .center{
    min-height:80vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .center-inner{ width:100%; max-width:380px; text-align:center; }
  .logo{width:84px;height:84px;border-radius:20px;margin:0 auto 20px;display:block;box-shadow:0 8px 20px rgba(22,35,59,.15);}
  input[type=text], input[type=tel], input[type=number]{
    font-size:22px;
    font-family:inherit;
    -webkit-appearance:none;
    appearance:none;
  }
  .pass-input{
    width:100%;
    text-align:center;
    letter-spacing:10px;
    font-size:32px;
    font-weight:700;
    padding:16px;
    border-radius:16px;
    border:2px solid var(--border);
    background:var(--card);
    color:var(--navy);
    margin-bottom:14px;
  }
  .pass-input:focus{ outline:2px solid var(--green); border-color:var(--green); }
  button{
    font-family:inherit;
    cursor:pointer;
  }
  .btn-big{
    appearance:none;
    border:none;
    background:var(--green);
    color:#fff;
    font-size:18px;
    font-weight:700;
    padding:16px 20px;
    border-radius:16px;
    width:100%;
    box-shadow:0 6px 16px rgba(0,191,99,.3);
  }
  .btn-big:active{ transform:scale(.98); }
  .btn-big:disabled{ background:#b9bfc6; box-shadow:none; }
  .err-text{ color:var(--red); font-size:14px; min-height:18px; margin-top:2px; }
  header.top{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }
  header.top img{ width:36px; height:36px; border-radius:9px; }
  header.top .ttl{ font-weight:700; font-size:16px; line-height:1.2; }
  header.top .sub{ font-size:12.5px; color:var(--soft); }
  .banner{
    border-radius:14px;
    padding:12px 14px;
    font-size:14px;
    margin-bottom:14px;
    line-height:1.5;
  }
  .banner.locked{ background:#fdf1ee; border:1px solid #f4cec7; color:#8a3a30; }
  .banner.open{ background:#eafaf1; border:1px solid #bfe9d1; color:#0f6b3f; }
  .room-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px;
    margin-bottom:10px;
    transition:background .2s, border-color .2s;
  }
  /* Đổi hẳn màu nền + viền khi phòng đã thực sự ghi điện — khác rõ với lúc mới load,
     để lướt mắt qua danh sách dài là biết ngay phòng nào xong, phòng nào chưa. */
  .room-card.done{
    background:#e9f8ef;
    border-color:#7fd3a3;
    box-shadow:inset 0 0 0 1px #7fd3a3;
  }
  .room-card.trong{ background:#fdfaf3; }
  .room-card.trong.done{ background:#e9f8ef; }
  .room-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
    gap:8px;
  }
  .room-num{ font-size:28px; font-weight:900; color:var(--red); letter-spacing:.3px; }
  .room-sub{ font-size:14px; font-weight:600; color:var(--soft); margin-left:4px; }
  .room-sub.trong{ color:var(--amber); }
  .room-badge{ font-size:12px; padding:3px 9px; border-radius:999px; background:#eef2f6; color:var(--soft); white-space:nowrap; }
  .room-badge.ok{ background:var(--green-dark); color:#fff; font-weight:800; }
  .save-flag{ font-size:11.5px; color:var(--green); font-weight:700; opacity:0; transition:opacity .25s; }
  .save-flag.show{ opacity:1; }
  .field-row{ margin-bottom:8px; }
  .field-label{ font-size:12.5px; color:var(--soft); margin-bottom:5px; font-weight:600; }
  .field-label .ref-hint{ color:var(--navy); font-weight:700; }
  .stepper{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .stepper button{
    width:40px;
    height:40px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#f5f2e9;
    font-size:20px;
    font-weight:700;
    color:var(--navy);
    flex-shrink:0;
  }
  .stepper button:active{ background:#e9e4d4; }
  .stepper .val{
    flex:1;
    text-align:center;
    font-size:21px;
    font-weight:800;
  }
  .num-input{
    width:100%;
    padding:11px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#fdfcf8;
    color:var(--navy);
    font-weight:800;
    text-align:center;
  }
  .num-input:focus{ outline:2px solid var(--green); border-color:var(--green); background:#fff; }
  .field-note{ font-size:11.5px; color:var(--soft); margin-top:4px; font-style:italic; }
  .usage-line{ font-size:12.5px; color:#0f6b3f; font-weight:700; margin-top:4px; min-height:16px; }
  .warn-line{ font-size:12.5px; color:var(--red); font-weight:700; margin-top:4px; min-height:16px; }
  .room-actions{
    display:flex;
    justify-content:flex-end;
    margin-top:2px;
  }
  .clear-btn{
    border:none;
    background:none;
    color:var(--red);
    font-size:12.5px;
    padding:6px 4px;
  }
  .footer-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    background:var(--cream);
    border-top:1px solid var(--border);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 16px rgba(22,35,59,.08);
  }
  .footer-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .footer-count{ flex:1; font-size:13px; color:var(--soft); }
  .next-btn{
    appearance:none;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--navy);
    font-size:12.5px;
    font-weight:700;
    padding:8px 12px;
    border-radius:10px;
    white-space:nowrap;
  }
  .empty-note{ text-align:center; color:var(--soft); padding:30px 10px; }
  .reload-btn{
    appearance:none;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--navy);
    font-size:14px;
    font-weight:700;
    padding:12px 18px;
    border-radius:12px;
    width:100%;
  }
</style>
</head>
<body>

<!-- ===== MÀN NHẬP MÃ ===== -->
<div id="gateScreen" class="center">
  <div class="center-inner">
    <img class="logo" src="icon-192.png" alt="" onerror="this.src='logo_187_xanhla.png'">
    <h1>Ghi số cuối tháng</h1>
    <p>Nhà Trọ 187 Ni Sư Huỳnh Liên — nhập mã do chủ nhà cung cấp để tiếp tục.</p>
    <input type="tel" inputmode="numeric" maxlength="6" class="pass-input" id="passInput" placeholder="• • •" autocomplete="off">
    <div class="err-text" id="passErr"></div>
    <button class="btn-big" onclick="checkPasscode()">Tiếp tục</button>
  </div>
</div>

<!-- ===== MÀN CHÍNH ===== -->
<div id="mainScreen" style="display:none;">
  <header class="top">
    <img src="icon-192.png" alt="" onerror="this.src='logo_187_xanhla.png'">
    <div>
      <div class="ttl">Ghi số cuối tháng</div>
      <div class="sub" id="monthLabelText">Đang tải…</div>
    </div>
  </header>

  <div id="statusBanner"></div>
  <div id="roomListWrap">
    <div class="empty-note">Đang tải danh sách phòng…</div>
  </div>
</div>

<!-- ===== THANH DƯỚI CÙNG (chỉ hiện khi đang mở) ===== -->
<div class="footer-bar" id="footerBar" style="display:none;">
  <div class="footer-row">
    <div class="footer-count" id="footerCount">Đã ghi 0/0 phòng</div>
    <button class="next-btn" onclick="scrollToNextUnfinished()">⏭ Phòng chưa ghi tiếp</button>
  </div>
  <button class="btn-big" id="submitBtn" onclick="guiChuNha()">📤 Gửi chủ nhà</button>
</div>

<script>
/* ĐÚNG LINK WEB APP APPS SCRIPT ĐANG DÙNG CHO NHÀ TRỌ 187 — nếu sau này anh Hưng
   deploy phiên bản mới (đổi URL) mà quên sửa dòng này, trang này sẽ gọi vào bản cũ.
   Kiểm tra khớp với "Link Web App" trong app chính > Cài đặt > Đồng bộ Google Sheet. */
const API_URL = 'https://script.google.com/macros/s/AKfycbzoLf_on_-YQcQBbGP_v0KvcoDlQDTaAsa7vgu5CFuiZDrvbzYg-w23-lYhY1lptvVJ/exec';
const PASSCODE = '187';
const UNLOCK_KEY = 'nt187_ghiso_unlocked';

let ROOMS = [];           // [{stt, trong, hoTenChinh, waterMeter, soxeHienTai, songuoiHienTai, dienThangTruoc, nuocThangTruoc}]
let ROOM_INFO = {};       // stt -> phần tử tương ứng trong ROOMS, tra nhanh khi validate
let DRAFT = {};           // stt -> {xe, songuoi, dien, nuoc}
let WINDOW_STATUS = 'closed';
let saveTimers = {};      // stt -> timeout id, debounce lưu từng phòng

function $(id){ return document.getElementById(id); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Cổng mã ---------- */
function checkPasscode(){
  const v = ($('passInput').value || '').trim();
  if(v === PASSCODE){
    try{ localStorage.setItem(UNLOCK_KEY, '1'); }catch(e){}
    enterApp();
  } else {
    $('passErr').textContent = 'Sai mã, hỏi lại chủ nhà.';
  }
}
$('passInput') && $('passInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter') checkPasscode();
});

function enterApp(){
  $('gateScreen').style.display = 'none';
  $('mainScreen').style.display = '';
  taiDuLieu();
}

/* ---------- Tải dữ liệu phòng + nháp ---------- */
async function taiDuLieu(){
  $('roomListWrap').innerHTML = '<div class="empty-note">Đang tải danh sách phòng…</div>';
  $('footerBar').style.display = 'none';
  try{
    const res = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'getGhiSoRooms'})});
    const json = await res.json();
    if(!json || json.status !== 'ok'){
      $('roomListWrap').innerHTML = '<div class="empty-note">Không tải được dữ liệu. Kiểm tra lại mạng rồi bấm "Tải lại".</div>' + reloadBtnHtml();
      return;
    }
    WINDOW_STATUS = json.windowStatus;
    ROOMS = json.rooms || [];
    ROOM_INFO = {};
    ROOMS.forEach(r => { ROOM_INFO[r.stt] = r; });
    DRAFT = {};
    (json.draft||[]).forEach(d => { DRAFT[d.stt] = d; });
    // Phòng CHƯA có nháp trên server → khởi tạo sẵn Xe/Người theo đúng dữ liệu hiện có của
    // tháng đang mở (thường ít đổi tháng này qua tháng khác) — người ghi chỉ cần xác nhận
    // hoặc sửa lại, không phải gõ/đếm lại từ đầu. Điện/Nước vẫn để trống, bắt buộc đọc mới.
    ROOMS.forEach(r => {
      if(!DRAFT[r.stt]){
        DRAFT[r.stt] = {stt:r.stt, xe:r.soxeHienTai||0, songuoi:r.songuoiHienTai||0, dien:null, nuoc:null};
      }
    });
    $('monthLabelText').textContent = json.monthLabel ? ('Tháng ' + json.monthLabel) : 'Nhà Trọ 187 NSHL';
    renderAll();
  }catch(err){
    $('roomListWrap').innerHTML = '<div class="empty-note">Lỗi kết nối: ' + (err && err.message ? err.message : err) + '</div>' + reloadBtnHtml();
  }
}
function reloadBtnHtml(){
  return '<div style="margin-top:14px;"><button class="reload-btn" onclick="taiDuLieu()">🔄 Tải lại</button></div>';
}

function renderAll(){
  renderBanner();
  if(WINDOW_STATUS === 'closed'){
    $('roomListWrap').innerHTML = '<div class="empty-note">Chủ nhà chưa mở tháng mới — chưa tới lúc ghi số.<br>Quay lại sau nhé.</div>' + reloadBtnHtml();
    $('footerBar').style.display = 'none';
    return;
  }
  if(!ROOMS.length){
    $('roomListWrap').innerHTML = '<div class="empty-note">Không có phòng nào để ghi số.</div>';
    $('footerBar').style.display = 'none';
    return;
  }
  const readOnly = (WINDOW_STATUS === 'submitted');
  $('roomListWrap').innerHTML = ROOMS.map(r => roomCardHtml(r, readOnly)).join('');
  ROOMS.forEach(r => updateFieldFeedback(r.stt));
  updateFooter();
  $('footerBar').style.display = readOnly ? 'none' : '';
}

function renderBanner(){
  const el = $('statusBanner');
  if(WINDOW_STATUS === 'submitted'){
    el.innerHTML = '<div class="banner locked">🔒 Đã gửi cho chủ nhà rồi — cần chủ nhà mở lại mới sửa được. Số đã ghi vẫn hiện bên dưới để anh/chị xem lại.</div>' + reloadBtnHtml();
  } else if(WINDOW_STATUS === 'open'){
    el.innerHTML = '<div class="banner open">🟢 Đang mở — ghi xong phòng nào tự lưu ngay phòng đó, không cần bấm gì thêm. Ghi xong hết thì bấm "Gửi chủ nhà" ở dưới cùng.</div>';
  } else {
    el.innerHTML = '';
  }
}

function isDaGhiDien(stt){
  const d = DRAFT[stt];
  return !!(d && d.dien !== null && d.dien !== undefined);
}

function roomCardHtml(r, readOnly){
  const d = DRAFT[r.stt] || {xe:r.soxeHienTai||0, songuoi:r.songuoiHienTai||0, dien:null, nuoc:null};
  const done = isDaGhiDien(r.stt);
  const dis = readOnly ? 'disabled' : '';
  const dienRef = r.dienThangTruoc!=null ? ('<span class="ref-hint">(tháng trước: '+r.dienThangTruoc+')</span>') : '';
  const dienPlaceholder = r.dienThangTruoc!=null ? ('≥ ' + r.dienThangTruoc) : 'VD: 4521';

  // Tên người ở chính (nếu có) hoặc nhãn "Phòng đang trống" ngay sau số phòng, để người
  // ghi dễ đối chiếu ngoài đời — khỏi lộn phòng khi cửa không ghi số phòng rõ ràng.
  const subLabel = r.trong
    ? '<span class="room-sub trong">(Phòng đang trống)</span>'
    : (r.hoTenChinh ? '<span class="room-sub">(' + escapeHtml(r.hoTenChinh) + ')</span>' : '');

  const dienField = `
      <div class="field-row">
        <div class="field-label">⚡ Điện — chỉ số đồng hồ ${dienRef}</div>
        <input type="tel" inputmode="decimal" class="num-input" style="font-size:22px;"
          id="dien_${r.stt}" value="${d.dien!=null?d.dien:''}" placeholder="${dienPlaceholder}" ${dis}
          oninput="onFieldChange(${r.stt})">
        <div class="field-note">Đồng hồ có số sau dấu chấm thì bỏ qua, chỉ ghi phần nguyên trước dấu chấm.</div>
        <div class="usage-line" id="dienUsage_${r.stt}"></div>
        <div class="warn-line" id="dienWarn_${r.stt}"></div>
      </div>`;

  // Phòng TRỐNG: chỉ hiện Điện (đề phòng có người lẻn vào dùng điện quên tắt), khỏi hỏi
  // Xe/Người/Nước vì không có ai ở để đếm.
  if (r.trong) {
    return `
    <div class="room-card trong ${done?'done':''}" id="room_${r.stt}">
      <div class="room-head">
        <div class="room-num">🚪 Phòng ${r.stt} ${subLabel}</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="save-flag" id="flag_${r.stt}">💾 Đã lưu</span>
          <span class="room-badge ${done?'ok':''}">${done?'✅ Đã ghi':'Chưa ghi'}</span>
        </div>
      </div>
      ${dienField}
      ${readOnly ? '' : `<div class="room-actions"><button class="clear-btn" onclick="xoaPhong(${r.stt})">🗑 Xoá số đã ghi phòng này</button></div>`}
    </div>`;
  }

  const waterRow = r.waterMeter ? (function(){
    const nuocRef = r.nuocThangTruoc!=null ? ('<span class="ref-hint">(tháng trước: '+r.nuocThangTruoc+')</span>') : '';
    const nuocPlaceholder = r.nuocThangTruoc!=null ? ('≥ ' + r.nuocThangTruoc) : 'VD: 1523';
    return `
      <div class="field-row">
        <div class="field-label">💧 Nước — chỉ số đồng hồ (khối) ${nuocRef}</div>
        <input type="tel" inputmode="decimal" class="num-input" style="font-size:22px;"
          id="nuoc_${r.stt}" value="${d.nuoc!=null?d.nuoc:''}" placeholder="${nuocPlaceholder}" ${dis}
          oninput="onFieldChange(${r.stt})">
        <div class="field-note">Đồng hồ có số sau dấu chấm thì bỏ qua, chỉ ghi phần nguyên trước dấu chấm.</div>
        <div class="usage-line" id="nuocUsage_${r.stt}"></div>
        <div class="warn-line" id="nuocWarn_${r.stt}"></div>
      </div>`;
  })() : '';

  return `
    <div class="room-card ${done?'done':''}" id="room_${r.stt}">
      <div class="room-head">
        <div class="room-num">🚪 Phòng ${r.stt} ${subLabel}</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="save-flag" id="flag_${r.stt}">💾 Đã lưu</span>
          <span class="room-badge ${done?'ok':''}">${done?'✅ Đã ghi':'Chưa ghi'}</span>
        </div>
      </div>

      <div class="field-row">
        <div class="field-label">🚗 Số xe</div>
        <div class="stepper">
          <button ${dis} onclick="stepVal(${r.stt},'xe',-1)">−</button>
          <div class="val" id="xeval_${r.stt}">${d.xe||0}</div>
          <button ${dis} onclick="stepVal(${r.stt},'xe',1)">+</button>
        </div>
      </div>

      <div class="field-row">
        <div class="field-label">👥 Số người ở</div>
        <div class="stepper">
          <button ${dis} onclick="stepVal(${r.stt},'songuoi',-1)">−</button>
          <div class="val" id="songuoival_${r.stt}">${d.songuoi||0}</div>
          <button ${dis} onclick="stepVal(${r.stt},'songuoi',1)">+</button>
        </div>
      </div>

      ${dienField}
      ${waterRow}

      ${readOnly ? '' : `<div class="room-actions"><button class="clear-btn" onclick="xoaPhong(${r.stt})">🗑 Xoá số đã ghi phòng này</button></div>`}
    </div>`;
}

/* ---------- Xe / Số người — nút bấm to, khỏi gõ ---------- */
function stepVal(stt, field, delta){
  if(!DRAFT[stt]) DRAFT[stt] = {xe:0, songuoi:0, dien:null, nuoc:null};
  const cur = Number(DRAFT[stt][field]) || 0;
  const next = Math.max(0, Math.min(20, cur + delta));
  DRAFT[stt][field] = next;
  const el = $((field==='xe'?'xeval_':'songuoival_') + stt);
  if(el) el.textContent = next;
  scheduleSave(stt);
}

/* ---------- Điện / Nước — gõ tay. Cho phép gõ dấu chấm tự nhiên như trên mặt đồng hồ,
   nhưng chỉ LẤY phần nguyên trước dấu chấm để lưu (parseInt tự cắt đúng chỗ đó). ---------- */
function onFieldChange(stt){
  if(!DRAFT[stt]) DRAFT[stt] = {xe:0, songuoi:0, dien:null, nuoc:null};
  const dienEl = $('dien_'+stt);
  const nuocEl = $('nuoc_'+stt);
  if(dienEl){
    const raw = (dienEl.value||'').replace(/[^\d.]/g,'');
    dienEl.value = raw;
    const parsed = raw==='' ? null : parseInt(raw, 10);
    DRAFT[stt].dien = (parsed==null || isNaN(parsed)) ? null : parsed;
  }
  if(nuocEl){
    const raw2 = (nuocEl.value||'').replace(/[^\d.]/g,'');
    nuocEl.value = raw2;
    const parsed2 = raw2==='' ? null : parseInt(raw2, 10);
    DRAFT[stt].nuoc = (parsed2==null || isNaN(parsed2)) ? null : parsed2;
  }
  updateRoomBadge(stt);
  updateFieldFeedback(stt);
  scheduleSave(stt);
}

/* ---------- Không cho ghi số nhỏ hơn tháng trước (đồng hồ điện/nước chỉ tăng) ---------- */
function isRoomValid(stt){
  const info = ROOM_INFO[stt] || {};
  const d = DRAFT[stt] || {};
  if(d.dien != null && info.dienThangTruoc != null && d.dien < info.dienThangTruoc) return false;
  if(info.waterMeter && d.nuoc != null && info.nuocThangTruoc != null && d.nuoc < info.nuocThangTruoc) return false;
  return true;
}

/* ---------- Hiện dòng cảnh báo (nếu nhập nhỏ hơn tháng trước) hoặc số đã dùng tháng này ---------- */
function updateFieldFeedback(stt){
  const info = ROOM_INFO[stt] || {};
  const d = DRAFT[stt] || {};
  const dienWarn = $('dienWarn_'+stt);
  const dienUsage = $('dienUsage_'+stt);
  if(dienWarn && dienUsage){
    if(d.dien != null && info.dienThangTruoc != null && d.dien < info.dienThangTruoc){
      dienWarn.textContent = '⚠️ Không được nhỏ hơn số tháng trước (' + info.dienThangTruoc + ') — kiểm tra lại.';
      dienUsage.textContent = '';
    } else {
      dienWarn.textContent = '';
      dienUsage.textContent = (d.dien != null && info.dienThangTruoc != null)
        ? ('✅ Dùng tháng này: ' + (d.dien - info.dienThangTruoc) + ' kWh') : '';
    }
  }
  if(info.waterMeter){
    const nuocWarn = $('nuocWarn_'+stt);
    const nuocUsage = $('nuocUsage_'+stt);
    if(nuocWarn && nuocUsage){
      if(d.nuoc != null && info.nuocThangTruoc != null && d.nuoc < info.nuocThangTruoc){
        nuocWarn.textContent = '⚠️ Không được nhỏ hơn số tháng trước (' + info.nuocThangTruoc + ') — kiểm tra lại.';
        nuocUsage.textContent = '';
      } else {
        nuocWarn.textContent = '';
        nuocUsage.textContent = (d.nuoc != null && info.nuocThangTruoc != null)
          ? ('✅ Dùng tháng này: ' + (d.nuoc - info.nuocThangTruoc) + ' khối') : '';
      }
    }
  }
}

/* ---------- Tự lưu — debounce 600ms mỗi phòng, không spam mạng khi họ bấm +/- liên tục.
   KHÔNG gửi lên server khi đang có cảnh báo nhỏ hơn tháng trước — giữ lại trên màn hình để
   họ tự sửa, tránh lỡ tay lưu số sai lên server rồi quên sửa lại. ---------- */
function scheduleSave(stt){
  updateRoomBadge(stt);
  if(saveTimers[stt]) clearTimeout(saveTimers[stt]);
  saveTimers[stt] = setTimeout(() => luuPhong(stt), 600);
}

function updateRoomBadge(stt){
  const done = isDaGhiDien(stt);
  const card = $('room_'+stt);
  if(card) card.classList.toggle('done', done);
  const badge = card ? card.querySelector('.room-badge') : null;
  if(badge){
    badge.textContent = done ? '✅ Đã ghi' : 'Chưa ghi';
    badge.classList.toggle('ok', done);
  }
  updateFooter();
}

async function luuPhong(stt){
  if(!isRoomValid(stt)) return; // đang có cảnh báo — không lưu, chờ họ sửa lại
  const d = DRAFT[stt] || {xe:0, songuoi:0, dien:null, nuoc:null};
  try{
    const res = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({
      action:'luuGhiSoDraft', stt: stt, xe: d.xe||0, songuoi: d.songuoi||0, dien: d.dien, nuoc: d.nuoc
    })});
    const json = await res.json();
    if(json && json.status === 'ok'){
      flashSaved(stt);
    } else if(json && json.message === 'closed'){
      taiDuLieu();
    }
  }catch(e){
    // Mất mạng thoáng qua — dữ liệu vẫn còn trên màn hình, họ gõ thêm ô khác sẽ tự thử lưu lại
  }
}
function flashSaved(stt){
  const el = $('flag_'+stt);
  if(!el) return;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1200);
}

async function xoaPhong(stt){
  if(!confirm('Xoá số đã ghi của phòng ' + stt + '?')) return;
  const info = ROOM_INFO[stt] || {};
  DRAFT[stt] = {stt:stt, xe:info.soxeHienTai||0, songuoi:info.songuoiHienTai||0, dien:null, nuoc:null};
  const xeEl = $('xeval_'+stt); if(xeEl) xeEl.textContent = String(DRAFT[stt].xe);
  const ngEl = $('songuoival_'+stt); if(ngEl) ngEl.textContent = String(DRAFT[stt].songuoi);
  const dienEl = $('dien_'+stt); if(dienEl) dienEl.value = '';
  const nuocEl = $('nuoc_'+stt); if(nuocEl) nuocEl.value = '';
  updateRoomBadge(stt);
  updateFieldFeedback(stt);
  try{
    await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'xoaGhiSoDraft', stt: stt})});
  }catch(e){}
}

function updateFooter(){
  const total = ROOMS.length;
  const done = ROOMS.filter(r => isDaGhiDien(r.stt)).length;
  const cEl = $('footerCount');
  if(cEl) cEl.textContent = 'Đã ghi ' + done + '/' + total + ' phòng';
}

/* ---------- Ý tưởng thêm: cuộn thẳng tới phòng chưa ghi gần nhất, đỡ kéo tay qua các
   phòng đã xong khi danh sách dài. ---------- */
function scrollToNextUnfinished(){
  const next = ROOMS.find(r => !isDaGhiDien(r.stt));
  if(!next){ alert('Đã ghi hết tất cả các phòng rồi!'); return; }
  const el = $('room_'+next.stt);
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}

/* ---------- Gửi chủ nhà — 1 lần chốt, khoá lại ngay sau khi thành công ---------- */
async function guiChuNha(){
  const invalidRooms = ROOMS.filter(r => !isRoomValid(r.stt));
  if(invalidRooms.length){
    alert('Còn phòng ' + invalidRooms.map(r=>r.stt).join(', ') + ' đang ghi số NHỎ HƠN tháng trước — sửa lại rồi mới gửi được.');
    return;
  }

  const chuaGhiDangO = ROOMS.filter(r => !r.trong && !isDaGhiDien(r.stt));
  const chuaGhiTrong = ROOMS.filter(r => r.trong && !isDaGhiDien(r.stt));
  const parts = [];
  // Cảnh báo NHẸ riêng cho phòng trống chưa ghi điện — dễ bị bỏ sót vì không có ai ở,
  // nhưng KHÔNG chặn gửi, chỉ nhắc để người ghi tự cân nhắc quay lại ghi hay bỏ qua.
  if(chuaGhiTrong.length){
    parts.push('⚠️ Phòng trống chưa ghi điện: ' + chuaGhiTrong.map(r=>r.stt).join(', ') + ' — nên ghi luôn để tránh sót điện hao hụt lúc trống.');
  }
  if(chuaGhiDangO.length){
    parts.push('Còn ' + chuaGhiDangO.length + ' phòng đang ở chưa ghi điện.');
  }
  parts.push('Xác nhận đã ghi xong, gửi cho chủ nhà?\nSau khi gửi sẽ KHOÁ LẠI, không sửa được nữa cho tới khi chủ nhà mở lại.');
  if(!confirm(parts.join('\n\n'))) return;

  const btn = $('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Đang gửi…';
  try{
    const res = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'chotGuiChuNha'})});
    const json = await res.json();
    if(json && json.status === 'ok'){
      alert('Đã gửi cho chủ nhà — cảm ơn anh/chị!');
      taiDuLieu();
    } else {
      alert('Lỗi: ' + (json && json.message ? json.message : 'không rõ') + '\nThử bấm Gửi lại.');
      btn.disabled = false;
      btn.textContent = '📤 Gửi chủ nhà';
    }
  }catch(err){
    alert('Lỗi kết nối, kiểm tra mạng rồi bấm Gửi lại.');
    btn.disabled = false;
    btn.textContent = '📤 Gửi chủ nhà';
  }
}

/* ---------- Khởi động: nếu đã nhập đúng mã trước đó trên máy này thì vào thẳng ---------- */
(function init(){
  let unlocked = false;
  try{ unlocked = localStorage.getItem(UNLOCK_KEY) === '1'; }catch(e){}
  if(unlocked) enterApp();
})();
</script>
