let _remoteRecoverySettings = null;
function openForgotDeviceCodeModal(){
  showModal(`
    <h3>Quên mã thiết bị mới?</h3>
    <div class="desc" id="fdc_intro">Đang tải câu hỏi bảo mật từ Google Sheet để xác minh bạn đúng là chủ app…</div>
    <div id="fdc_body"></div>
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Đóng</button></div>
  `);
  loadRemoteRecoveryQuestions();
}
async function loadRemoteRecoveryQuestions(){
  const url = DEFAULT_SETTINGS.sheetWebhookUrl;
  const intro = document.getElementById('fdc_intro');
  const body = document.getElementById('fdc_body');
  if(!url){ if(intro) intro.textContent = 'App chưa gắn sẵn link Google Sheet, không thể xác minh từ xa.'; return; }
  try{
    const res = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'loadState'})});
    const text = await res.text();
    let json = null;
    try{ json = JSON.parse(text); }catch(e){}
    if(!(json && json.status==='ok' && json.data)){ if(intro) intro.textContent = 'Chưa có dữ liệu nào trên Google Sheet để xác minh.'; return; }
    const remote = JSON.parse(json.data);
    const s = remote.settings || {};
    if(!s.recoveryQuestion1 || !s.recoveryQuestion2 || !s.recoveryAnswer1 || !s.recoveryAnswer2){
      if(intro) intro.textContent = 'Bạn chưa thiết lập đủ 2 câu hỏi bảo mật từ trước (mục Cài đặt), nên không thể khôi phục theo cách này.';
      return;
    }
    _remoteRecoverySettings = s;
    if(intro) intro.textContent = 'Trả lời đúng cả 2 câu hỏi bên dưới để xem lại mã thiết bị mới hiện tại.';
    if(body) body.innerHTML = `
      <div class="field"><label>${escapeAttr(s.recoveryQuestion1)}</label><input type="text" spellcheck="false" autocorrect="off" autocapitalize="off" id="fdc_a1"></div>
      <div class="field"><label>${escapeAttr(s.recoveryQuestion2)}</label><input type="text" spellcheck="false" autocorrect="off" autocapitalize="off" id="fdc_a2"></div>
      <div class="err-msg" id="fdc_err"></div>
      <button class="btn btn-primary btn-block" onclick="confirmForgotDeviceCode()">Xác nhận</button>
    `;
  }catch(err){
    if(intro) intro.textContent = 'Lỗi kết nối: '+describeSyncError(err);
  }
}
function confirmForgotDeviceCode(){
  const a1 = (document.getElementById('fdc_a1').value||'').trim().toLowerCase();
  const a2 = (document.getElementById('fdc_a2').value||'').trim().toLowerCase();
  const errEl = document.getElementById('fdc_err');
  const s = _remoteRecoverySettings;
  if(!s){ closeModal(); return; }
  if(a1 !== (s.recoveryAnswer1||'').trim().toLowerCase() || a2 !== (s.recoveryAnswer2||'').trim().toLowerCase()){
    errEl.textContent = 'Câu trả lời chưa đúng, thử lại.';
    return;
  }
  const code = s.deviceCode || DEFAULT_SETTINGS.deviceCode;
  closeModal();
  const codeInput = document.getElementById('deviceCodeInput');
  if(codeInput){ codeInput.type = 'text'; codeInput.value = code; }
  showToast('Đúng rồi! Mã thiết bị mới đã tự điền phía trên, bấm Đăng nhập luôn được.');
}
async function openForgotPasswordModal(){
  const settings = (await stGetJSON('settings')) || {};
  const q1 = settings.recoveryQuestion1, q2 = settings.recoveryQuestion2;
  const ready = q1 && q2 && settings.recoveryAnswer1 && settings.recoveryAnswer2;
  if(!ready){
    showModal(`
      <h3>Quên mật khẩu</h3>
      <div class="desc">Bạn chưa thiết lập đủ 2 câu hỏi bảo mật để tự khôi phục. App này không có máy chủ riêng nên không thể gửi mã qua email/SMS thật.</div>
      <div class="desc">Mật khẩu mặc định ban đầu là <b>187nshl</b> — hãy thử mật khẩu này nếu bạn chưa từng đổi. Nếu đã đổi và quên, hãy đăng nhập lại khi nhớ ra, rồi vào mục Cài đặt để thiết lập đủ 2 câu hỏi bảo mật cho lần sau.</div>
      <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Đóng</button></div>
    `);
    return;
  }
  showModal(`
    <h3>Khôi phục mật khẩu</h3>
    <div class="desc">Trả lời đúng cả 2 câu hỏi bảo mật để đặt lại mật khẩu.</div>
    <div class="field"><label>${q1}</label><input type="text" spellcheck="false" autocorrect="off" autocapitalize="off" id="rc_answer1"></div>
    <div class="field"><label>${q2}</label><input type="text" spellcheck="false" autocorrect="off" autocapitalize="off" id="rc_answer2"></div>
    <div class="field"><label>Mật khẩu mới</label><input type="password" id="rc_newpw"></div>
    <div class="err-msg" id="rc_err"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Hủy</button>
      <button class="btn btn-primary" onclick="confirmRecovery()">Đặt lại mật khẩu</button>
    </div>
  `);
}
async function confirmRecovery(){
  const settings = (await stGetJSON('settings')) || {};
  const ans1 = (document.getElementById('rc_answer1').value||'').trim().toLowerCase();
  const ans2 = (document.getElementById('rc_answer2').value||'').trim().toLowerCase();
  const newPw = document.getElementById('rc_newpw').value;
  const errEl = document.getElementById('rc_err');
  if(ans1 !== (settings.recoveryAnswer1||'').trim().toLowerCase() || ans2 !== (settings.recoveryAnswer2||'').trim().toLowerCase()){
    errEl.textContent = 'Câu trả lời chưa đúng, vui lòng kiểm tra lại cả 2 câu.';
    return;
  }
  if(!newPw){ errEl.textContent = 'Vui lòng nhập mật khẩu mới.'; return; }
  await stSet('auth-password', newPw);
  closeModal();
  showToast('Đã đặt lại mật khẩu, hãy đăng nhập lại.');
}
async function changePassword(){
  const oldPw = document.getElementById('pw_old').value;
  const newPw = document.getElementById('pw_new').value;
  const savedPw = (await stGet('auth-password')) || DEFAULT_PASSWORD;
  if(oldPw !== savedPw){ showToast('Mật khẩu hiện tại không đúng.'); return; }
  if(!newPw){ showToast('Vui lòng nhập mật khẩu mới.'); return; }
  await stSet('auth-password', newPw);
  await touchLastModified();
  showToast('Đã đổi mật khẩu.');
  document.getElementById('pw_old').value=''; document.getElementById('pw_new').value='';
}
async function changeDeviceCode(){
  const oldCode = document.getElementById('dc_old').value;
  const newCode = document.getElementById('dc_new').value;
  const savedCode = STATE.settings.deviceCode || DEFAULT_SETTINGS.deviceCode;
  if(oldCode !== savedCode){ showToast('Mã hiện tại không đúng.'); return; }
  if(!newCode){ showToast('Vui lòng nhập mã mới.'); return; }
  STATE.settings.deviceCode = newCode;
  await stSetJSON('settings', STATE.settings);
  await touchLastModified();
  showToast('Đã đổi mã xác nhận thiết bị mới.');
  document.getElementById('dc_old').value=''; document.getElementById('dc_new').value='';
}
async function exportBackup(){
  const backup = {settings: STATE.settings, monthsIndex: STATE.monthsIndex, months:{}};
  for(const mm of STATE.monthsIndex){
    backup.months[mm.key] = mm.key===STATE.currentKey ? STATE.monthData : await stGetJSON('month:'+mm.key);
  }
  const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'saoluu_187nshl_'+(new Date().toISOString().slice(0,10))+'.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Đã tải file sao lưu.');
}
function importBackup(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(data.settings) { STATE.settings = data.settings; await stSetJSON('settings', data.settings); }
      if(data.monthsIndex) { STATE.monthsIndex = data.monthsIndex; await stSetJSON('months-index', data.monthsIndex); }
      if(data.months){
        for(const k in data.months){ await stSetJSON('month:'+k, data.months[k]); }
      }
      await touchLastModified();
      showToast('Phục hồi thành công. Đang tải lại…');
      setTimeout(()=>loadAll(), 800);
    }catch(e){ showToast('File sao lưu không hợp lệ.'); }
  };
  reader.readAsText(file);
}
