<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes">
<title>Sổ Thu Tiền — Nhà Trọ 187 NSHL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --paper:#FAF5E9;
  --paper-2:#F1E8D4;
  --card:#FFFDF8;
  --ink:#22241F;
  --ink-soft:#5B5A4E;
  --navy:#16233B;
  --navy-2:#1F3050;
  --brass:#B8863B;
  --brass-dark:#8C6526;
  --brass-light:#E6C989;
  --brick:#A8442B;
  --brick-dark:#8A3722;
  --green-ok:#2F6B4F;
  --green-bg:#E3EFE6;
  --line:#DCCFAE;
  --danger:#B23A3A;
  --danger-bg:#F6E4E1;
  --shadow: 0 1px 2px rgba(22,35,59,.06), 0 4px 16px rgba(22,35,59,.06);
  --radius: 10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 500px at 10% -10%, #FFFCF5 0%, transparent 60%),
    var(--paper);
  color:var(--ink);
  font-family:'Be Vietnam Pro', -apple-system, sans-serif;
  font-size:14px;
  line-height:1.45;
  min-height:100vh;
}
.mono{font-family:'JetBrains Mono', ui-monospace, monospace;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:14px;}
a{color:inherit;}

/* ---------- Login ---------- */
#loginScreen{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
}
.login-card{
  width:100%; max-width:380px; background:var(--card); border:1px solid var(--line);
  border-radius:16px; padding:36px 30px 30px; box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.login-card::before{
  content:""; position:absolute; top:0; left:0; right:0; height:6px;
  background:repeating-linear-gradient(90deg, var(--brass) 0 14px, var(--brick) 14px 28px);
}
.login-seal{
  width:56px;height:56px;border-radius:50%; margin:0 auto 14px; display:flex; align-items:center; justify-content:center;
  background:var(--navy); color:var(--brass-light); font-weight:800; font-size:20px; letter-spacing:.5px;
  border:2px solid var(--brass);
}
.login-card h1{font-size:19px; text-align:center; margin:0 0 2px; color:var(--navy); font-weight:800;}
.login-card p.sub{text-align:center; color:var(--ink-soft); margin:0 0 22px; font-size:12.5px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; text-transform:uppercase; letter-spacing:.04em;}
.field input, .field select, .field textarea{
  width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--brass-light); border-color:var(--brass);}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:10px 16px; border-radius:8px; border:1px solid transparent; font-weight:600; font-size:13.5px;
  transition:transform .05s ease, filter .15s ease;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--navy); color:#fff;}
.btn-primary:hover{filter:brightness(1.15);}
.btn-brass{background:var(--brass); color:#2A1D06;}
.btn-brass:hover{filter:brightness(1.06);}
.btn-outline{background:transparent; border-color:var(--line); color:var(--ink);}
.btn-outline:hover{background:var(--paper-2);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-block{width:100%;}
.btn-sm{padding:6px 10px; font-size:12px; border-radius:6px;}
.err-msg{color:var(--danger); font-size:12.5px; margin-top:8px; text-align:center; min-height:16px;}
.hint{font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:16px;}
.forgot-link{display:block; text-align:center; margin-top:12px; font-size:12.5px; color:var(--brass-dark); text-decoration:underline; cursor:pointer; background:none; border:none;}
.btn-logout{background:var(--brick); color:#fff; font-weight:700; padding:9px 16px;}
.btn-logout:hover{background:var(--brick-dark);}

/* ---------- App shell ---------- */
#appScreen{display:none; min-height:100vh; flex-direction:column;}
header.topbar{
  background:var(--navy); color:#EFE7D3; padding:12px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  border-bottom:3px solid var(--brass);
}
.brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:15px; letter-spacing:.02em;}
.brand .seal-mini{width:30px;height:30px;border-radius:50%;background:var(--brass); color:var(--navy); display:flex;align-items:center;justify-content:center; font-size:13px; font-weight:800; flex-shrink:0;}
.cloud-indicator{display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:4px 9px; border-radius:20px; background:rgba(255,255,255,.1); color:#c9c2ab; white-space:nowrap;}
.cloud-indicator.syncing{background:rgba(184,134,59,.25); color:var(--brass-light);}
.cloud-indicator.synced{background:rgba(47,107,79,.25); color:#8fd6ac;}
.cloud-indicator.error{background:rgba(168,68,43,.3); color:#ffb3a3;}
.cloud-indicator .dot{width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0;}
.cloud-indicator.syncing .dot{animation:pulse-dot 1s ease-in-out infinite;}
@keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:.3;}}
.month-picker{display:flex; align-items:center; gap:6px; margin-left:auto;}
.month-picker select{background:var(--navy-2); color:#fff; border:1px solid #3a4a6b; border-radius:7px; padding:7px 10px;}
.topbar .btn{padding:8px 12px; font-size:12.5px;}

nav.tabs{
  display:flex; gap:2px; background:var(--paper-2); padding:0 12px; overflow-x:auto; border-bottom:1px solid var(--line);
}
nav.tabs button{
  background:none; border:none; padding:12px 14px; font-weight:600; font-size:13px; color:var(--ink-soft);
  border-bottom:3px solid transparent; white-space:nowrap;
}
nav.tabs button.active{color:var(--navy); border-bottom-color:var(--brick);}
nav.tabs button:hover{color:var(--navy);}

main{flex:1; padding:16px; max-width:1100px; width:100%; margin:0 auto;}
footer.appfoot{text-align:center; color:var(--ink-soft); font-size:11px; padding:16px 10px; opacity:.7; line-height:1.7;}
footer.appfoot .foot-line{display:block;}

.panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:var(--shadow);}
.panel h2{margin:0 0 4px; font-size:16px; color:var(--navy);}
.panel .desc{color:var(--ink-soft); font-size:12.5px; margin:0 0 14px;}

.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:14px;}
.stat{background:var(--paper-2); border:1px solid var(--line); border-radius:9px; padding:10px 12px;}
.stat .lbl{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; margin-bottom:3px;}
.stat .val{font-size:17px; font-weight:700; color:var(--navy);}
.stat.good .val{color:var(--green-ok);}
.stat.bad .val{color:var(--brick);}

.toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px;}
.toolbar input[type=text], .toolbar input[type=search]{padding:8px 10px; border:1px solid var(--line); border-radius:7px; min-width:160px;}
.spacer{flex:1;}

/* room accordion */
.room-card{border:1px solid var(--line); border-radius:9px; margin-bottom:8px; background:#fff; overflow:hidden;}
.room-card.inactive{opacity:.6;}
.room-head{display:flex; align-items:center; gap:10px; padding:11px 12px; cursor:pointer; user-select:none; position:sticky; top:0; z-index:4; background:#fff; border-bottom:1px solid transparent;}
.room-card.open .room-head{border-bottom-color:var(--line); box-shadow:0 2px 4px rgba(22,35,59,.05);}
.room-head:hover{background:var(--paper-2);}
.room-num{
  width:34px;height:34px;border-radius:8px;background:var(--navy); color:var(--brass-light); font-weight:800;
  display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0;
}
.room-card.inactive .room-num{background:#9a9384;}
.room-num.contract-warn{background:#D9791E !important; color:#fff;}
.room-num.contract-expired{background:var(--brick) !important; color:#fff;}
.room-mid{flex:1; min-width:0;}
.room-mid .note{font-size:11.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.room-total{font-weight:700; color:var(--navy); font-size:14.5px; white-space:nowrap;}
.room-total.urgent-yellow{color:#946200; background:#FFF3CD; padding:2px 7px; border-radius:5px;}
.room-total.urgent-red{color:#fff; background:var(--brick); padding:2px 7px; border-radius:5px;}
.urgent-yellow{color:#946200; background:#FFF3CD; padding:2px 7px;}
.urgent-red{color:#fff; background:var(--brick); padding:2px 7px;}
.pill{display:inline-block; font-weight:700; font-size:11.5px; padding:3px 10px; border-radius:20px; white-space:nowrap; line-height:1.4;}
.pill-red{background:var(--brick); color:#fff;}
.pill-yellow{background:#FFF3CD; color:#946200;}
.pill-muted{background:var(--paper-2); color:var(--ink-soft); font-weight:600;}
.pill-green{background:var(--green-bg); color:var(--green-ok);}
.month-highlight{color:var(--brick); font-weight:800;}
.text-center{text-align:center !important;}
.paid-pill{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap;}
.paid-pill.yes{background:var(--green-bg); color:var(--green-ok);}
.paid-pill.no{background:var(--danger-bg); color:var(--danger);}
.chev{transition:transform .15s ease; color:var(--ink-soft); flex-shrink:0;}
.room-card.open .chev{transform:rotate(90deg);}
.room-body{display:none; border-top:1px solid var(--line); padding:14px; background:var(--paper-2);}
.room-card.open .room-body{display:block;}

.form-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px 12px;}
.form-grid .f label{display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px; font-weight:600;}
.form-grid .f input, .form-grid .f select{width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px;}
.form-grid .f.span2{grid-column:span 2;}
.section-title{font-size:11.5px; font-weight:700; color:var(--brass-dark); text-transform:uppercase; letter-spacing:.05em; margin:14px 0 8px; border-bottom:1px dashed var(--line); padding-bottom:4px;}
.section-title:first-child{margin-top:0;}
.breakdown{display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:12.5px;}
.breakdown span b{color:var(--navy);}

.checkbox-row{display:flex; align-items:center; gap:8px;}
.checkbox-row input{width:auto;}

.sticky-actions{
  position:sticky; bottom:0; background:var(--paper); border-top:1px solid var(--line); padding:10px 0; margin-top:10px;
  display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;
}

/* tables */
table.data{width:100%; border-collapse:collapse; font-size:12.5px;}
table.data th{background:var(--navy); color:#EFE7D3; text-align:left; padding:8px 9px; font-weight:600; white-space:nowrap;}
table.data td{padding:7px 9px; border-bottom:1px solid var(--line); white-space:nowrap;}
table.data tr:nth-child(even) td{background:#FBF8F0;}
table.data tfoot td{font-weight:700; background:var(--paper-2); border-top:2px solid var(--brass);}
.table-wrap{overflow-x:auto; border-radius:8px; border:1px solid var(--line); position:relative;}
.table-wrap table.data{border:none;}
.table-wrap table.data th.sticky-col{position:sticky; left:0; z-index:3; background:var(--navy);}
.table-wrap table.data td.sticky-col{position:sticky; left:0; z-index:2; background:var(--card); box-shadow:2px 0 5px rgba(22,35,59,.08);}

/* receipts */
.receipt{
  background:#fffef9; border:1px dashed var(--ink-soft); border-radius:6px; padding:16px; max-width:480px; margin:0 auto 18px;
  position:relative;
}
.receipt-header{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid var(--navy); padding-bottom:8px; margin-bottom:8px;}
.receipt-header .rname{font-weight:800; color:var(--navy); font-size:15px;}
.receipt-header .rroom{font-size:13px; color:var(--ink-soft);}
.receipt-header .rdate{font-size:11.5px; color:var(--ink-soft); text-align:right;}
.receipt-header .rmonth-big{color:var(--brick); font-weight:800; font-size:15px;}
.receipt-total-hero{font-weight:800; font-size:15px; margin-bottom:8px; padding-bottom:6px; border-bottom:1px dashed var(--line); display:flex; justify-content:space-between; align-items:baseline;}
.receipt-total-hero .hero-label{color:var(--brick);}
.receipt-total-hero .room-num-big{font-size:22px; font-weight:900; margin:0 2px; display:inline-block;}
.receipt-total-hero .amt{color:var(--brick);}
table.receipt-tbl{width:100%; border-collapse:collapse; font-size:12px;}
table.receipt-tbl th{text-align:left; border-bottom:1px solid var(--ink); padding:4px 3px; font-size:11px;}
table.receipt-tbl td{padding:4px 3px; border-bottom:1px dotted var(--line); vertical-align:top;}
table.receipt-tbl thead th:nth-child(1), table.receipt-tbl tbody td:nth-child(1){text-align:center;}
table.receipt-tbl thead th:nth-child(3), table.receipt-tbl tbody td:nth-child(3){text-align:center;}
table.receipt-tbl thead th:nth-child(4), table.receipt-tbl tbody td:nth-child(4){text-align:center;}
table.receipt-tbl thead th:nth-child(5), table.receipt-tbl tbody td:nth-child(5){text-align:center;}
table.receipt-tbl thead th:nth-child(6), table.receipt-tbl tbody td:nth-child(6){text-align:right;}
table.receipt-tbl tfoot td{font-weight:800; border-top:2px solid var(--navy); border-bottom:none; font-size:13.5px; color:var(--navy);}
table.receipt-tbl tfoot td:last-child{text-align:right;}
.receipt-note{font-size:10.5px; color:var(--ink-soft); margin-top:8px; white-space:pre-wrap; line-height:1.5;}
.qr-block{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); display:flex; gap:12px; align-items:center;}
.qr-block img{width:110px; height:110px; border-radius:6px; border:1px solid var(--line); flex-shrink:0; background:#fff;}
.qr-block .qr-text{font-size:10.5px; color:var(--ink-soft); line-height:1.5;}
.qr-block .qr-text b{color:var(--navy);}
.qr-caption{font-size:9.5px; color:var(--brass-dark); font-weight:700; margin-top:3px;}
.stamp{
  position:absolute; top:14px; right:16px; width:74px; height:74px; border:3px solid var(--brick); border-radius:50%;
  color:var(--brick); display:flex; align-items:center; justify-content:center; text-align:center; font-weight:800;
  font-size:10.5px; transform:rotate(-14deg); opacity:.85; line-height:1.15; letter-spacing:.02em;
}

/* misc */
.badge{display:inline-block; background:var(--brass-light); color:var(--brass-dark); font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:20px;}
.empty-state{text-align:center; padding:40px 20px; color:var(--ink-soft);}
.modal-overlay{position:fixed; inset:0; background:rgba(22,20,15,.5); display:none; align-items:center; justify-content:center; z-index:100; padding:16px;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--card); border-radius:14px; padding:22px; max-width:440px; width:100%; box-shadow:var(--shadow); max-height:88vh; overflow-y:auto;}
.modal-box h3{margin:0 0 4px; color:var(--navy);}
.modal-box .desc{color:var(--ink-soft); font-size:12.5px; margin-bottom:16px;}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}
.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:10px 18px;
  border-radius:8px; font-size:13px; box-shadow:var(--shadow); z-index:200; opacity:0; transition:opacity .25s ease; pointer-events:none;
}
.toast.show{opacity:1;}

.img-viewer-overlay{
  position:fixed; inset:0; background:rgba(10,12,10,.94); z-index:300;
  display:none; flex-direction:column;
}
.img-viewer-overlay.show{display:flex;}
.img-viewer-toolbar{
  flex-shrink:0; display:flex; align-items:center; gap:8px; padding:10px 14px;
  background:rgba(0,0,0,.5); color:#fff;
}
.img-viewer-toolbar button{
  background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.25);
  border-radius:6px; padding:7px 12px; font-size:14px; font-weight:700; min-width:40px;
}
.img-viewer-toolbar button:hover{background:rgba(255,255,255,.22);}
.img-viewer-toolbar span{font-size:13px; font-weight:700; min-width:48px; text-align:center;}
.img-viewer-scroll{
  flex:1; overflow:auto; display:flex; align-items:center; justify-content:center;
  -webkit-overflow-scrolling:touch; touch-action:pinch-zoom pan-x pan-y;
}
.img-viewer-scroll img{
  max-width:none; transition:transform .15s ease; transform-origin:center center;
  cursor:zoom-in;
}

@media print{
  header.topbar, nav.tabs, .no-print, footer.appfoot{display:none !important;}
  body{background:#fff;}
  main{max-width:none; padding:0;}
  .receipt{page-break-after:always; border:1px solid #999; box-shadow:none;}
  .receipt:last-child{page-break-after:auto;}
}
@media (max-width:640px){
  .form-grid{grid-template-columns:repeat(2,1fr);}
  .stat-row{grid-template-columns:repeat(2,1fr);}
  main{padding:10px;}
  .modal-box{padding:16px; max-width:100%;}
  table.data{font-size:11.5px;}
  table.data th, table.data td{padding:6px 7px;}
  .receipt{padding:12px;}
  .login-card{padding:28px 18px 22px;}
}
@media (max-width:400px){
  .stat-row{grid-template-columns:1fr 1fr;}
  .stat .val{font-size:15px;}
  header.topbar{padding:10px 12px;}
  .brand{font-size:13.5px;}
  .month-picker select{padding:6px 8px; font-size:12.5px;}
  nav.tabs button{padding:10px 11px; font-size:12px;}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-seal">187</div>
    <h1>Nhà Trọ 187 NSHL</h1>
    <p class="sub">Sổ thu tiền phòng trọ — chỉ dành cho quản lý</p>
    <div class="field" id="deviceCodeWrap" style="display:none;">
      <label for="deviceCodeInput">Mã xác nhận thiết bị mới</label>
      <input type="password" id="deviceCodeInput" placeholder="Nhập mã bảo mật" autocomplete="off">
      <button type="button" class="forgot-link" style="text-align:left; padding:0; margin-top:6px;" onclick="openForgotDeviceCodeModal()">Quên mã thiết bị mới?</button>
    </div>
    <div class="field">
      <label for="pwInput">Mật khẩu</label>
      <input type="password" id="pwInput" placeholder="Nhập mật khẩu" autocomplete="off">
    </div>
    <button class="btn btn-primary btn-block" onclick="tryLogin()">Đăng nhập</button>
    <div class="err-msg" id="loginErr"></div>
    <button class="forgot-link" onclick="openForgotPasswordModal()">Quên mật khẩu?</button>
    <p class="hint">Dữ liệu lưu ngay trên trình duyệt này, tự đồng bộ qua Google Sheet sau khi đăng nhập.</p>
  </div>
</div>

<div id="appScreen">
  <header class="topbar">
    <div class="brand"><span class="seal-mini">187</span> Sổ Thu Tiền Nhà Trọ</div>
    <span class="cloud-indicator" id="cloudIndicator" title="Chưa cấu hình Google Sheet"><span class="dot"></span><span id="cloudIndicatorText">Chưa đồng bộ</span></span>
    <div class="month-picker">
      <select id="monthSelect" onchange="onChangeMonth(this.value)"></select>
      <button class="btn btn-brass btn-sm" onclick="openNewMonthModal()">+ Tháng mới</button>
    </div>
    <button class="btn btn-logout btn-sm" onclick="logout()">🚪 Đăng xuất</button>
  </header>

  <nav class="tabs" id="tabsNav"></nav>

  <main id="mainContent"></main>

  <footer class="appfoot"><span class="foot-line">Nhà Trọ 187 Ni Sư Huỳnh Liên · dữ liệu lưu tự động</span><span class="foot-line">Phiên bản: 3.0</span></footer>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>
<div class="toast" id="toast"></div>
<div class="img-viewer-overlay" id="imgViewerOverlay">
  <div class="img-viewer-toolbar">

const LS_PREFIX = 'nt187_';
async function stGet(key){
  try{
    const v = localStorage.getItem(LS_PREFIX+key);
    return v===null ? null : v;
  }catch(e){ return null; }
}
async function stSet(key,val){
  try{
    localStorage.setItem(LS_PREFIX+key, val);
    return true;
  }catch(e){ return false; }
}
async function stGetJSON(key){
  const v = await stGet(key);
  if(v===null||v===undefined) return null;
  try{ return JSON.parse(v); }catch(e){ return null; }
}
async function stSetJSON(key,obj){
  return stSet(key, JSON.stringify(obj));

/* ============ CARRY-FORWARD DEBT (nợ tháng trước chưa đóng / đóng thiếu) ============ */
async function refreshPrevDebts(){
  STATE.prevDebts = {};
  const idx = STATE.monthsIndex;
  const pos = idx.findIndex(m=>m.key===STATE.currentKey);
  if(pos<=0) return; // no previous month on record
  const running = {}; // stt -> số tiền còn thiếu mang sang tháng kế tiếp
  for(let i=0;i<pos;i++){
    const mm = idx[i];
    const data = mm.key===STATE.currentKey ? STATE.monthData : await stGetJSON('month:'+mm.key);
    if(!data) continue;
    data.rooms.forEach(r=>{
      let prevRunning = running[r.stt] || 0;
      if(r.khachMoi){ prevRunning = 0; } // khách mới bắt đầu ở tháng này: xoá nợ cũ của phòng, không cộng dồn nữa
      const c = computeRoom(r, mm.key);
      const rWithC = Object.assign({}, r, {_c:c});
      const phaiThu = (r.active ? c.tong : 0) + prevRunning;
      const daDong = r.active ? calcRoomDaDong(rWithC, prevRunning) : 0;
      running[r.stt] = Math.max(0, phaiThu - daDong);
    });
  }
  const prevLabel = idx[pos-1].label;
  Object.keys(running).forEach(sttStr=>{
    const amt = running[sttStr];
    if(amt>0){
      STATE.prevDebts[Number(sttStr)] = {amount:amt, monthLabel:prevLabel, monthKey:idx[pos-1].key};
    }
  });
}

let cloudSyncTimer = null;
function describeSyncError(err){
  const msg = err && err.message ? err.message : String(err);
  if(/failed to fetch/i.test(msg)){
    return 'Không kết nối được tới Google Sheet. Kiểm tra lại: (1) link Web App đã đúng và kết thúc bằng /exec, (2) lúc Triển khai đã chọn "Người có quyền truy cập: Bất kỳ ai", (3) thiết bị đang có Internet.';
  }
  return msg;
}
function setCloudIndicator(state, text){

  const txt = document.getElementById('cloudIndicatorText');

  el.className = 'cloud-indicator' + (state ? ' '+state : '');

function scheduleCloudSync(){
  const url = STATE.settings && STATE.settings.sheetWebhookUrl;
  if(!url) { setCloudIndicator('', 'Chưa đồng bộ'); return; }
  setCloudIndicator('', 'Đang chờ lưu…');

  cloudSyncTimer = setTimeout(autoSyncToSheet, 3000);

async function autoSyncToSheet(){
  const url = (STATE.settings && STATE.settings.sheetWebhookUrl || '').trim();
  if(!url) return;
  setCloudIndicator('syncing', 'Đang đồng bộ…');
  try{
    await saveCurrentMonth();
    const payload = await buildFullStatePayload();
    const res = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    const text = await res.text();
    let json = null;
    try{ json = JSON.parse(text); }catch(e){}
    const timeStr = new Date().toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
    if(json && json.status==='ok'){
      setCloudIndicator('synced', 'Đã đồng bộ '+timeStr);
      const statusEl = document.getElementById('sheetSyncStatus');
      if(statusEl) statusEl.textContent = '✅ Tự động đồng bộ lúc '+timeStr;
    } else {
      setCloudIndicator('error', 'Lỗi đồng bộ');
      const statusEl = document.getElementById('sheetSyncStatus');
      if(statusEl) statusEl.textContent = '⚠️ Phản hồi bất thường lúc tự động đồng bộ: '+text.slice(0,200);
    }
  }catch(err){
    setCloudIndicator('error', 'Lỗi kết nối');
    const statusEl = document.getElementById('sheetSyncStatus');
    if(statusEl) statusEl.textContent = '❌ Lỗi tự động đồng bộ: '+describeSyncError(err);
  }
}

async function confirmNewMonth(){
  const nk = document.getElementById('nmMonth').value; // YYYY-MM
  const errEl = document.getElementById('nm_err');
  if(!nk){ return; }

  }
  if(STATE.monthsIndex.find(m=>m.key===nk)){ showToast('Tháng này đã tồn tại!'); return; }
  const deadline = document.getElementById('nmDeadline').value;
  const chiphi = readChiphiFields('nm_');

  await saveCurrentMonth();

  const newRooms = STATE.monthData.rooms.map(r=>{
    const nr = Object.assign({}, r);

function stripDiacritics(str){
  return String(str||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')

    .replace(/[^a-zA-Z0-9 .-]/g,'').trim();

  if(addInfo) params.set('addInfo', stripDiacritics(addInfo).slice(0,50));
  if(accountName) params.set('accountName', stripDiacritics(accountName));
  return `https://img.vietqr.io/image/${encodeURIComponent(bankBin)}-${encodeURIComponent(accountNo)}-${t}.png?${params.toString()}`;
}

/* contract / hợp đồng helpers */
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function addMonths(iso, n){
  if(!iso) return null;
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, (m-1)+Number(n||0), d);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function contractEndDate(r){
  if(!r.ngayVaoO) return null;
  return addMonths(r.ngayVaoO, r.soThangHopDong||6);
}
function daysUntil(iso){
  if(!iso) return null;
  const target = new Date(iso+'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((target-today)/86400000);
}
function daysSince(iso){
  if(!iso) return null;
  const start = new Date(iso+'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((today-start)/86400000);
}
function contractWarnDays(){ return (STATE.settings && STATE.settings.contractWarnDays) || 30; }
function roomDebtInfo(r){
  const debt = STATE.prevDebts[r.stt];
  if(!debt) return null;
  return debt;
}
function roomTotalWithDebt(r){
  const debt = roomDebtInfo(r);
  return r._c.tong + (debt? debt.amount : 0);
}
function calcRoomDaDong(r, debtAmount){
  if(!r.paid) return 0;
  const phaiThu = r._c.tong + (debtAmount||0);
  const soTien = Number(r.soTienDaDong)||0;
  return soTien>0 ? soTien : phaiThu; // để trống/0 = đóng đủ
}
function calcRoomThieu(r, debtAmount){
  const phaiThu = r._c.tong + (debtAmount||0);
  return Math.max(0, phaiThu - calcRoomDaDong(r, debtAmount));
}
function roomDaDongAmount(r){ return calcRoomDaDong(r, roomDebtInfo(r)? roomDebtInfo(r).amount : 0); }
function roomThieuAmount(r){ return calcRoomThieu(r, roomDebtInfo(r)? roomDebtInfo(r).amount : 0); }
function contractStatusClass(r){
  const end = contractEndDate(r);
  if(!end) return '';
  const d = daysUntil(end);
  if(d<0) return 'contract-expired';
  if(d<=contractWarnDays()) return 'contract-warn';
  return '';
}
/* payment urgency coloring: only for the real-world current month */
function paymentUrgencyClass(){
  const now = new Date();
  const thisKey = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  if(STATE.monthData.key !== thisKey) return '';
  const day = now.getDate();
  if(day>25) return 'urgent-red';
  return '';
}

/* ============ COMPUTE ============ */
function computeRoom(r, monthKey){
  if(!r.active){
    // phòng trống: không tính bất kỳ khoản nào, dù các trường số liệu còn sót giá trị cũ
    return {tienNuoc:0, tienXe:0, dienDaDung:0, tienDien:0, tienRac:0, dieuchinh:0, tienPhong:0, prorated:false, tong:0};
  }
  const dienDaDung = Math.max(0,(Number(r.sodienmoi||0)-Number(r.sodiencu||0)));
  const tienDien = dienDaDung*Number(r.dongiaDien||0); // điện luôn tính theo đúng số đã dùng thực tế, không chia tỷ lệ ngày
  const dieuchinh = Number(r.dieuchinh||0);

  // Xác định có phải tháng đầu tiên ở (mới dọn vào giữa tháng) hay không
  let dim = null, soNgayConLai = null, prorated = false;
  if(r.ngayVaoO && monthKey){
    const [vy,vm,vd] = r.ngayVaoO.split('-').map(Number);
    const [my,mm] = monthKey.split('-').map(Number);
    if(vy===my && vm===mm){
      dim = daysInMonth(my,mm);
      soNgayConLai = Math.max(0, dim - vd + 1);
      prorated = true;
    }
  }
  // với các khoản tính theo tháng (phòng, nước-theo-người, xe, rác): nếu là tháng đầu tiên,
  // tính như thể ở nguyên tháng rồi chia cho số ngày trong tháng, nhân số ngày còn lại thực tế ở.
  // Nước tính theo đồng hồ riêng thì không chia tỷ lệ (đã tính đúng theo số đã dùng thực tế, giống điện).
  const tienPhong = prorated ? Math.round(Number(r.gia||0)/dim*soNgayConLai) : Number(r.gia||0);

  const tienNuocDayDu = Number(r.songuoi||0)*Number(r.dongiaNuoc||0);
  const tienNuoc = r.waterMeter
    ? Math.max(0,(Number(r.nuocMoi||0)-Number(r.nuocCu||0)))*Number(r.dongiaNuoc||0)
    : (prorated ? Math.round(tienNuocDayDu/dim*soNgayConLai) : tienNuocDayDu);

  const tienXeDayDu = Number(r.soxe||0)*Number(r.dongiaXe||0);
  const tienXe = prorated ? Math.round(tienXeDayDu/dim*soNgayConLai) : tienXeDayDu;

  const tienRacDayDu = r.racmode==='nguoi' ? Number(r.songuoi||0)*Number(r.dongiaRac||0) : Number(r.dongiaRac||0);
  const tienRac = prorated ? Math.round(tienRacDayDu/dim*soNgayConLai) : tienRacDayDu;

  const tong = tienPhong + tienNuoc + tienXe + tienDien + tienRac + dieuchinh;
  return {tienNuoc, tienXe, dienDaDung, tienDien, tienRac, dieuchinh, tienPhong, prorated, soNgayConLai, soNgayTrongThang:dim, tong};
}
function computeMonth(md){
  const rooms = md.rooms.map(r=>Object.assign({}, r, {_c: computeRoom(r, md.key)}));
  const totals = rooms.reduce((a,r)=>{
    a.gia += r._c.tienPhong;
    a.nuoc += r._c.tienNuoc;
    a.xe += r._c.tienXe;
    a.dien += r._c.tienDien;
    a.rac += r._c.tienRac;
    a.dieuchinh += r._c.dieuchinh;
    a.tong += r._c.tong;
    if(r.paid) a.daThu += r._c.tong;
    if(r.active) a.soPhongHD++;
    if(r.paid) a.soPhongDaDong++;
    return a;
  }, {gia:0,nuoc:0,xe:0,dien:0,rac:0,dieuchinh:0,tong:0,daThu:0,soPhongHD:0,soPhongDaDong:0});
  const c = md.chiphi;
  const tongChi = (c.luongBaoVe||0)+(c.internet||0)+(c.dienChung||0)+(c.racChung||0)+(c.nuocChung||0)+(c.ca||0)+(c.suaChua||0)+(c.chuaChay||0)+(c.chiKhac||0);
  const tienNha = c.tienNha||0;
  const conDu = totals.tong - tongChi - tienNha;
  return {rooms, totals, tongChi, tienNha, conDu};
}

function docsListHtml(roomStt, o){
  const types = giayToTypesList();
  const docs = o.documents || {};
  let totalPhotos = 0;
  const sections = types.map((t,ti)=>{
    let arr = docs[t] || [];
    if(!Array.isArray(arr)) arr = [arr]; // tương thích dữ liệu cũ (từng lưu 1 ảnh dạng object đơn)
    totalPhotos += arr.length;
    return `<div style="margin-bottom:5px;">
      <div style="font-size:10px; font-weight:700; color:var(--ink-soft); margin-bottom:3px;">${escapeAttr(t)}${arr.length?` (${arr.length} ảnh)`:''}</div>
      <div style="display:flex; flex-wrap:wrap; gap:6px;">
        ${arr.map((d,idx)=>`
          <span style="display:inline-flex; gap:3px;">
            <button class="btn btn-outline btn-sm" onclick="viewDoc('${d.fileId}')">👁 Ảnh ${idx+1}</button>
            <button class="btn btn-outline btn-sm" onclick="confirmDeleteDoc(${roomStt},'${o.id}',${ti},${idx})">🗑</button>
          </span>`).join('')}
        <label class="btn btn-outline btn-sm" style="margin:0;">📎 Thêm ảnh (VD: mặt trước/sau)
          <input type="file" accept="image/*" style="display:none" onchange="uploadDocForOccupant(${roomStt},'${o.id}',${ti},this.files[0]); this.value='';">
        </label>
      </div>
    </div>`;
  }).join('');
  const openByDefault = totalPhotos > 0;
  const docsId = 'docs-'+o.id;
  return `
    <div class="docs-toggle" onclick="toggleDocsSection('${docsId}')" style="cursor:pointer; display:flex; align-items:center; gap:6px; margin-top:6px; font-size:11px; font-weight:700; color:var(--brass-dark); user-select:none;">

    </div>
    <div id="${docsId}" style="display:${openByDefault?'block':'none'}; margin-top:4px;">
      ${sections}
    </div>
  `;
}

  const data = {

/* ---- Ảnh giấy tờ qua Google Drive (dùng chung link Apps Script đã cấu hình) ---- */
async function compressImageFile(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>=h && w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h>w && h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality).split(',')[1]);
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function uploadDocForOccupant(roomStt, occupantId, docTypeIndex, file){
  if(!file) return;
  const docType = giayToTypesList()[docTypeIndex];
  if(!docType) return;
  const url = (STATE.settings.sheetWebhookUrl||'').trim();
  if(!url){ showToast('Chưa cấu hình link Google Sheet/Apps Script trong Cài đặt.'); return; }
  showToast('Đang nén và tải ảnh lên Google Drive…');
  try{
    const base64 = await compressImageFile(file, 1600, 0.8);
    const res = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({
      action:'uploadDoc', roomStt, base64Data: base64, mimeType:'image/jpeg', fileName:`Phong${roomStt}_${docType}_${occupantId}_${Date.now()}.jpg`
    })});
    const text = await res.text();
    let json = null;
    try{ json = JSON.parse(text); }catch(e){}
    if(json && json.status==='ok'){
      const r = STATE.monthData.rooms.find(x=>x.stt===roomStt);
      const o = r && (r.nguoiO||[]).find(x=>x.id===occupantId);
      if(o){
        if(!o.documents) o.documents = {};
        if(!o.documents[docType]) o.documents[docType] = [];
        if(!Array.isArray(o.documents[docType])) o.documents[docType] = [o.documents[docType]];
        o.documents[docType].push({fileId: json.fileId, uploadedAt: Date.now()});
        scheduleSave();
        renderMain();
      }
      showToast('Đã tải ảnh lên Google Drive.');
    } else {
      showToast('Tải lên thất bại: '+(json&&json.message?json.message:describeSyncError({message:text.slice(0,150)})));
    }
  }catch(err){
    showToast('Lỗi tải lên: '+describeSyncError(err));
  }
}
async function viewDoc(fileId){
  const url = (STATE.settings.sheetWebhookUrl||'').trim();
  if(!url){ showToast('Chưa cấu hình link Google Sheet/Apps Script.'); return; }
  showToast('Đang tải ảnh…');
  try{
    const res = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'getDoc', fileId})});
    const text = await res.text();
    let json = null;
    try{ json = JSON.parse(text); }catch(e){}
    if(json && json.status==='ok' && json.base64){
      openImgViewer(`data:${json.mimeType};base64,${json.base64}`);
    } else {
      showToast('Không tải được ảnh: '+describeSyncError({message:text.slice(0,150)}));
    }
  }catch(err){
    showToast('Lỗi: '+describeSyncError(err));
  }
}
function confirmDeleteDoc(roomStt, occupantId, docTypeIndex, idx){
  const docType = giayToTypesList()[docTypeIndex] || '';
  showModal(`

    <div class="desc">Xoá ảnh "${escapeAttr(docType)}" — Ảnh ${idx+1}. Ảnh sẽ bị xoá khỏi Google Drive (vẫn còn trong Thùng rác Drive 30 ngày nếu lỡ tay).</div>

      <button class="btn btn-danger" onclick="doDeleteDoc(${roomStt}, '${occupantId}', ${docTypeIndex}, ${idx})">Xoá</button>
    </div>
  `);
}
async function doDeleteDoc(roomStt, occupantId, docTypeIndex, idx){
  const docType = giayToTypesList()[docTypeIndex];
  const r = STATE.monthData.rooms.find(x=>x.stt===roomStt);
  const o = r && (r.nguoiO||[]).find(x=>x.id===occupantId);
  if(!o || !docType || !o.documents || !o.documents[docType]){ closeModal(); return; }
  let arr = o.documents[docType];
  if(!Array.isArray(arr)) arr = [arr];
  const target = arr[idx];
  if(!target){ closeModal(); return; }
  const url = (STATE.settings.sheetWebhookUrl||'').trim();
  closeModal();
  showToast('Đang xoá…');
  try{
    if(url){
      await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'deleteDoc', fileId: target.fileId})});
    }
  }catch(err){ /* vẫn xoá tham chiếu trong app dù lỡ lỗi kết nối tới Drive */ }
  arr.splice(idx,1);
  o.documents[docType] = arr;
  scheduleSave();
  renderMain();
  showToast('Đã xoá ảnh giấy tờ.');
}

async function applyTenantChange(stt, isNewTenant){
  const r = STATE.monthData.rooms.find(x=>x.stt===stt);
  if(!r) return;
  r.active = true;
  r.khachMoi = !!isNewTenant;
  r.ngayTrong = ''; // không còn trống nữa
  if(isNewTenant){
    archiveCurrentTenancy(r, todayISO()); // đề phòng còn sót người ở cũ chưa được lưu lịch sử
    r.ngayVaoO = todayISO();
    const cocEl = document.getElementById('nt_coc');
    if(cocEl){ r.coc = parseMoneyVal(cocEl); }
  } else {
    // khách cũ ở tiếp: nếu vừa lỡ bấm "Phòng trống" trong chính hôm nay rồi đổi ý,
    // khôi phục lại đúng người ở + ngày vào ở gốc đã lưu vào lịch sử, thay vì để trống phải nhập lại từ đầu
    let restored = false;
    if((!r.nguoiO || !r.nguoiO.length) && r.lichSuKhach && r.lichSuKhach.length){
      const last = r.lichSuKhach[r.lichSuKhach.length-1];
      if(last.denNgay === todayISO()){
        r.nguoiO = last.nguoiO || [];
        r.ngayVaoO = last.tuNgay || todayISO();
        r.lichSuKhach.pop(); // không tính là đã dọn đi thật, bỏ khỏi lịch sử
        restored = true;
      }
    }
    if(!restored && !r.ngayVaoO){ r.ngayVaoO = todayISO(); }
  }
  scheduleSave();
  await refreshPrevDebts();
  renderMain();
  if(isNewTenant){
    showNewTenantReceiptModal(stt);
  } else {
    closeModal();
    showToast('Đã khôi phục trạng thái khách cũ ở tiếp.');
  }
}

async function quickShareReceipt(stt){
  const m = computeMonth(STATE.monthData);
  const r = m.rooms.find(x=>x.stt===stt);
  if(!r){ showToast('Không tìm thấy phòng.'); return; }
  showToast('Đang chuẩn bị ảnh để chia sẻ…');
  const temp = document.createElement('div');
  temp.style.position = 'fixed'; temp.style.left = '-9999px'; temp.style.top = '0';
  temp.innerHTML = receiptHtml(r, STATE.settings, {showQR:true});
  document.body.appendChild(temp);
  const el = temp.querySelector('.receipt');
  await inlineImagesForCapture(el);
  const canvas = await html2canvas(el, {scale:2, backgroundColor:'#fffef9', useCORS:true});
  document.body.removeChild(temp);
  const blob = await new Promise(res=>canvas.toBlob(res,'image/png'));
  const fileName = `Phong_${stt}_${STATE.monthData.key}_tamtinh.png`;
  const file = new File([blob], fileName, {type:'image/png'});
  const shareData = {
    files:[file],
    title:`Phiếu tạm tính phòng ${stt}`,
    text:`Phiếu tạm tính phòng ${stt} — ${STATE.monthData.label}`
  };
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share(shareData); return; }
    catch(err){ if(err && err.name==='AbortError'){ return; } }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=fileName; a.click();
  URL.revokeObjectURL(url);
  showToast('Trình duyệt chưa hỗ trợ chia sẻ trực tiếp — đã tải ảnh về, mở Zalo và đính kèm gửi khách nhé.');

    <div class="desc">Nhập số điện hiện tại (lúc khách rời đi) để chốt sổ điện — tiền điện kỳ cuối sẽ tự trừ vào tiền cọc. Bỏ trống nếu không muốn chốt/trừ tiền điện.</div>
    <div class="field"><label>Số điện lúc rời đi (tuỳ chọn)</label><input type="number" id="vc_dien" placeholder="để trống nếu bỏ qua" oninput="updateVacatePreview(${stt})"></div>
    <div class="field"><label>Trừ cọc thêm — hư hỏng, chưa dọn dẹp... (tuỳ chọn)</label>
      <input type="text" spellcheck="false" autocorrect="off" autocapitalize="off" inputmode="numeric" id="vc_tru" placeholder="0" oninput="onMoneyInputFmt(this); updateVacatePreview(${stt})">
    </div>
    <div class="field"><label>Lý do trừ thêm</label><input type="text" spellcheck="false" autocorrect="off" autocapitalize="off" id="vc_lydo" placeholder="VD: làm hư tủ lạnh, chưa dọn phòng..."></div>
    <div class="breakdown" id="vc_preview" style="border-top:1px dashed var(--line); padding-top:8px;">
      ${vacatePreviewHtml(r, '', 0)}
    </div>

      <button class="btn btn-outline" onclick="closeModal(); renderMain();">Hủy</button>
      <button class="btn btn-primary" onclick="applyVacate(${stt})">Xác nhận phòng trống</button>
    </div>
  `);
}
function vacatePreviewHtml(r, dienVal, truThem){
  const coc = Number(r.coc)||0;
  let dienCuoiKy = 0;
  if(dienVal !== ''){
    dienCuoiKy = Math.max(0, Number(dienVal) - Number(r.sodiencu||0)) * Number(r.dongiaDien||0);
  }
  const hoanLai = Math.max(0, coc - dienCuoiKy - (Number(truThem)||0));
  return `
    <span>Tiền cọc hiện có: <b class="mono">${fmtVND(coc)}</b></span>
    <span>Trừ điện cuối kỳ: <b class="mono" style="color:var(--brick);">${fmtVND(dienCuoiKy)}</b></span>
    <span>Trừ khác: <b class="mono" style="color:var(--brick);">${fmtVND(truThem||0)}</b></span>
    <span>= <b class="mono" style="font-size:14px;color:var(--green-ok);">Hoàn lại khách: ${fmtVND(hoanLai)}</b></span>
  `;
}
function updateVacatePreview(stt){
  const r = STATE.monthData.rooms.find(x=>x.stt===stt);
  if(!r) return;
  const dienVal = document.getElementById('vc_dien').value;
  const truVal = parseMoneyVal(document.getElementById('vc_tru'));
  const el = document.getElementById('vc_preview');
  if(el) el.innerHTML = vacatePreviewHtml(r, dienVal, truVal);
}
async function applyVacate(stt){
  const r = STATE.monthData.rooms.find(x=>x.stt===stt);
  if(!r) return;
  const dienVal = document.getElementById('vc_dien').value;
  const truThem = parseMoneyVal(document.getElementById('vc_tru'));
  const lyDo = (document.getElementById('vc_lydo').value||'').trim();

  const cocGoc = Number(r.coc)||0;
  let dienCuoiKy = 0;
  if(dienVal !== ''){
    const reading = Number(dienVal);
    dienCuoiKy = Math.max(0, reading - Number(r.sodiencu||0)) * Number(r.dongiaDien||0);
    r.sodienmoi = reading;
    r.sodiencu = reading; // chốt sổ điện, làm mốc cho khách tiếp theo
  }
  const hoanLai = Math.max(0, cocGoc - dienCuoiKy - truThem);

  archiveCurrentTenancy(r, todayISO());
  r.active = false;
  r.songuoi = 0; r.soxe = 0; r.coc = 0;
  r.ngayVaoO = '';
  r.ngayTrong = todayISO();

  if(cocGoc>0 || dienCuoiKy>0 || truThem>0){
    const parts = [`Cọc ${fmtVND(cocGoc)}`];
    if(dienCuoiKy>0) parts.push(`trừ điện cuối kỳ ${fmtVND(dienCuoiKy)}`);
    if(truThem>0) parts.push(`trừ khác ${fmtVND(truThem)}${lyDo?(' ('+lyDo+')'):''}`);
    parts.push(`hoàn lại ${fmtVND(hoanLai)}`);
    r.ghichu = ((r.ghichu||'').trim() ? r.ghichu.trim()+' · ' : '') + parts.join(', ') + ` (${fmtDate(todayISO())})`;
  }

  scheduleSave();
  await refreshPrevDebts();
  closeModal();
  renderMain();
  showToast('Đã chuyển phòng '+stt+' sang trạng thái trống. Hoàn lại khách: '+fmtVND(hoanLai));
}

  if(!vacantRooms.length){ showToast('Hiện không có phòng nào đang trống để dời sang.'); return; }

  showModal(`

    <div class="field"><label>Số điện phòng mới lúc dọn vào (tuỳ chọn)</label><input type="number" id="tf_newreading" placeholder="để trống = giữ số đầu tháng"></div>
    <div class="field"><label>Ghi chú</label><input type="text" spellcheck="false" autocorrect="off" autocapitalize="off" id="tf_note" value="Dời P${fromStt} ${fmtDateShort(todayISO())}"></div>
    <div class="err-msg" id="tf_err"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal(); renderMain();">Hủy</button>
      <button class="btn btn-primary" onclick="confirmTransfer(${fromStt})">Xác nhận dời phòng</button>
    </div>
  `);
}
async function confirmTransfer(fromStt){
  const targetStt = Number(document.getElementById('tf_target').value);
  const oldReadingVal = document.getElementById('tf_oldreading').value;
  const newReadingVal = document.getElementById('tf_newreading').value;
  const note = (document.getElementById('tf_note').value||'').trim();
  const errEl = document.getElementById('tf_err');
  const oldRoom = STATE.monthData.rooms.find(x=>x.stt===fromStt);
  const newRoom = STATE.monthData.rooms.find(x=>x.stt===targetStt);
  if(!oldRoom || !newRoom){ errEl.textContent = 'Không tìm thấy phòng.'; return; }
  if(newRoom.active){ errEl.textContent = 'Phòng đích không còn trống, vui lòng chọn lại.'; return; }

  // giữ lại thông tin khách trước khi xoá ở phòng cũ
  const tenant = {songuoi:oldRoom.songuoi||0, soxe:oldRoom.soxe||0, coc:oldRoom.coc||0, nguoiO: JSON.parse(JSON.stringify(oldRoom.nguoiO||[]))};

  let dienPhongCu = 0, dienNote = '';
  if(oldReadingVal !== ''){
    const oldReading = Number(oldReadingVal);
    const oldCu = Number(oldRoom.sodiencu||0);
    const daDung = Math.max(0, oldReading - oldCu);
    dienPhongCu = daDung * Number(oldRoom.dongiaDien||0);
    oldRoom.sodienmoi = oldReading;
    dienNote = ` — điện P${fromStt} chốt: ${daDung} số × ${fmtVND(oldRoom.dongiaDien)} = ${fmtVND(dienPhongCu)} (${oldReading} - ${oldCu} = ${daDung} số)`;
  }

  // đóng sổ phòng cũ, trả về trạng thái trống (lưu lịch sử người ở trước khi xoá)
  archiveCurrentTenancy(oldRoom, todayISO());
  oldRoom.sodiencu = oldRoom.sodienmoi!=null ? oldRoom.sodienmoi : oldRoom.sodiencu;
  oldRoom.active = false;
  oldRoom.songuoi = 0; oldRoom.soxe = 0; oldRoom.coc = 0; oldRoom.ngayVaoO = '';
  oldRoom.ngayTrong = todayISO();
  oldRoom.ghichu = ((oldRoom.ghichu||'').trim() ? oldRoom.ghichu.trim()+' · ' : '') + `Đã dời sang P${targetStt} (${fmtDateShort(todayISO())})`;

  // mở phòng mới cho khách, kế thừa số người/xe/cọc/giấy tờ, cộng tiền điện phòng cũ vào điều chỉnh
  newRoom.active = true;
  newRoom.khachMoi = true; // nợ cũ (nếu có) của phòng này trước đây coi như đã chốt, không cộng dồn cho khách mới tới
  newRoom.ngayTrong = '';
  newRoom.ngayVaoO = todayISO();
  newRoom.songuoi = tenant.songuoi;
  newRoom.soxe = tenant.soxe;
  newRoom.coc = tenant.coc;
  newRoom.nguoiO = tenant.nguoiO;
  if(newReadingVal !== ''){ newRoom.sodiencu = Number(newReadingVal); }
  newRoom.dieuchinh = Number(newRoom.dieuchinh||0) + dienPhongCu;
  newRoom.ghichu = (note || `Dời P${fromStt} ${fmtDateShort(todayISO())}`) + dienNote;

  scheduleSave();
  await refreshPrevDebts();
  closeModal();
  renderMain();
  showToast(`Đã dời khách từ phòng ${fromStt} sang phòng ${targetStt}.`);
}

/* Chuyển ảnh QR (tải từ img.vietqr.io, khác domain) thành data URL nhúng sẵn,
   để html2canvas chụp được đầy đủ thay vì bị trống do giới hạn CORS ảnh chéo domain. */
async function inlineImagesForCapture(container){
  const imgs = container.querySelectorAll('.qr-block img');
  for(const img of imgs){
    if(img.dataset.inlined==='1') continue;
    let ok = false;
    for(let attempt=0; attempt<3 && !ok; attempt++){
      try{
        const res = await fetch(img.src, {mode:'cors'});
        if(!res.ok) throw new Error('HTTP '+res.status);
        const blob = await res.blob();
        const dataUrl = await new Promise((resolve,reject)=>{
          const reader = new FileReader();
          reader.onload = ()=>resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
        img.src = dataUrl;
        img.dataset.inlined = '1';
        ok = true;
      }catch(err){
        // thử lại sau 1 nhịp ngắn — có thể do gửi liên tục quá nhanh bị tạm chặn
        if(attempt<2) await new Promise(r=>setTimeout(r, 350*(attempt+1)));
      }
    }
    // giữ nguyên URL cũ nếu vẫn lỗi sau 3 lần — html2canvas với useCORS:true sẽ thử tải trực tiếp
  }
}
function waitForImagesToLoad(container, timeoutMs){
  const imgs = Array.from(container.querySelectorAll('img'));
  const promises = imgs.map(img=>{
    if(img.complete && img.naturalWidth>0) return Promise.resolve();
    return new Promise(resolve=>{
      img.addEventListener('load', resolve, {once:true});
      img.addEventListener('error', resolve, {once:true}); // vẫn cho qua để không treo mãi nếu 1 ảnh lỗi
    });
  });
  const all = Promise.all(promises);
  const timeout = new Promise(resolve=>setTimeout(resolve, timeoutMs||8000));
  return Promise.race([all, timeout]);
}
async function shareReceipt(){
  const sel = document.getElementById('phieuRoomSelect').value;
  if(sel==='ALL'){ showToast('Vui lòng chọn 1 phòng cụ thể trước.'); return; }
  const el = document.querySelector(`#receiptsWrap .receipt[data-stt="${sel}"]`);
  if(!el){ showToast('Không tìm thấy phiếu.'); return; }
  showToast('Đang chuẩn bị ảnh để chia sẻ…');
  await inlineImagesForCapture(el);
  const canvas = await html2canvas(el, {scale:2, backgroundColor:'#fffef9', useCORS:true});
  const blob = await new Promise(res=>canvas.toBlob(res,'image/png'));
  const fileName = `Phong_${sel}_${STATE.monthData.key}.png`;
  const file = new File([blob], fileName, {type:'image/png'});
  const shareData = {
    files:[file],
    title:`Phiếu thu phòng ${sel} — ${STATE.monthData.label}`,
    text:`Phiếu thu tiền phòng ${sel} — ${STATE.monthData.label}`
  };
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share(shareData);
      return;
    }catch(err){
      if(err && err.name==='AbortError'){ return; } // người dùng tự huỷ chia sẻ
      // rơi xuống phần tải ảnh dự phòng bên dưới nếu chia sẻ lỗi
    }
  }
  // Trình duyệt không hỗ trợ chia sẻ file (thường gặp trên máy tính): tải ảnh về, tự đính kèm vào Zalo
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=fileName; a.click();
  URL.revokeObjectURL(url);
  showToast('Trình duyệt này chưa hỗ trợ chia sẻ trực tiếp — đã tải ảnh về, bạn mở Zalo và đính kèm ảnh gửi khách nhé.');
}

async function doExportAllImages(){
  showToast('Đang tạo ảnh, vui lòng đợi…');
  const prevSel = STATE.phieuSelected;
  renderReceiptsList('ALL', true);
  const els = document.querySelectorAll('#receiptsWrap .receipt');

    const canvas = await html2canvas(el, {scale:2, backgroundColor:'#fffef9', useCORS:true});

    await new Promise(r=>setTimeout(r, 150)); // giãn nhịp giữa các phòng, tránh gửi quá nhiều yêu cầu liên tục
  }

  URL.revokeObjectURL(url);

async function doExportAllPDF(){
  showToast('Đang tạo PDF, vui lòng đợi…');
  const prevSel = STATE.phieuSelected;
  renderReceiptsList('ALL', true);
  const els = document.querySelectorAll('#receiptsWrap .receipt');
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:'px', format:'a5'});
  let first = true;
  let done = 0;
  for(const el of els){
    await inlineImagesForCapture(el);
    const canvas = await html2canvas(el, {scale:2, backgroundColor:'#fffef9', useCORS:true});
    const imgData = canvas.toDataURL('image/png');
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const ratio = Math.min(pageW/canvas.width, pageH/canvas.height);
    const w = canvas.width*ratio, h = canvas.height*ratio;
    if(!first) pdf.addPage();
    pdf.addImage(imgData, 'PNG', (pageW-w)/2, 10, w, h);
    first = false;
    done++;
    showToast(`Đang tạo PDF… (${done}/${els.length})`);
    await new Promise(r=>setTimeout(r, 150)); // giãn nhịp giữa các phòng, tránh gửi quá nhiều yêu cầu liên tục
  }
  pdf.save(`PhieuThu_${STATE.monthData.key}.pdf`);
  renderReceiptsList(prevSel);
  showToast('Đã tải file PDF.');
}

function getMovedOutTamTruFlat(){
  const list = [];
  STATE.monthData.rooms.forEach(r=>{
    (r.lichSuKhach||[]).forEach((h,hi)=>{
      (h.nguoiO||[]).forEach((o,oi)=>{
        if(o.daDangKyTamTru){ list.push({r, h, hi, o, oi}); }
      });
    });
  });
  return list.sort((a,b)=> (b.h.denNgay||'').localeCompare(a.h.denNgay||''));
}
function renderMovedOutList(){
  const el = document.getElementById('movedOutList');
  if(!el) return;
  let list = getMovedOutTamTruFlat();
  const filter = STATE.movedOutFilter||'pending';
  if(filter==='pending') list = list.filter(x=>!x.o.daBaoXoaTamTru);
  else if(filter==='done') list = list.filter(x=>x.o.daBaoXoaTamTru);
  if(!list.length){ el.innerHTML = '<div class="empty-state">Không có ai trong danh sách này.</div>'; return; }
  el.innerHTML = `<div class="table-wrap"><table class="data">
    <thead><tr><th class="text-center sticky-col">Phòng</th><th>Họ tên</th><th>CCCD</th><th>Ngày dọn đi</th><th class="text-center">Đã báo xoá</th></tr></thead>
    <tbody>
      ${list.map(x=>`<tr>
        <td class="text-center sticky-col"><b>${x.r.stt}</b></td>
        <td>${escapeAttr(x.o.hoTen||'(chưa có tên)')}</td>
        <td>${escapeAttr(x.o.cccd||'—')}</td>
        <td>${x.h.denNgay?fmtDate(x.h.denNgay):'—'}</td>
        <td class="text-center"><input type="checkbox" ${x.o.daBaoXoaTamTru?'checked':''} onchange="toggleBaoXoaTamTru(${x.r.stt}, ${x.hi}, ${x.oi}, this.checked)"></td>
      </tr>`).join('')}
    </tbody>
  </table></div>`;
}
function toggleBaoXoaTamTru(stt, historyIndex, occupantIndex, checked){
  const r = STATE.monthData.rooms.find(x=>x.stt===stt);
  const h = r && r.lichSuKhach && r.lichSuKhach[historyIndex];
  const o = h && h.nguoiO && h.nguoiO[occupantIndex];
  if(!o) return;
  o.daBaoXoaTamTru = checked;
  if(checked && !o.ngayBaoXoaTamTru) o.ngayBaoXoaTamTru = todayISO();
  scheduleSave();
  renderMovedOutList();
}
function exportMovedOutTamTruList(){
  const list = getMovedOutTamTruFlat();
  if(!list.length){ showToast('Không có ai trong danh sách này để xuất.'); return; }
  const header = TAM_TRU_HEADER.concat(['Ngày dọn đi']);
  const aoa = [[`DANH SÁCH ĐÃ DỌN ĐI — CẦN BÁO XOÁ TẠM TRÚ — Nhà trọ 187 NSHL`], [], header];
  list.forEach(x=>{
    aoa.push([
      x.o.hoTen||'', x.o.soDienThoai||'', x.r.stt, x.o.ngaySinh||'', x.o.cccd||'',
      x.o.daDangKyTamTru?'Có':'Không', x.o.ngayCapCccd||'', x.o.noiCapCccd||'',
      x.o.diaChiThuongTru||'', x.o.ngheNghiep||'', x.o.gioiTinh||'', x.h.denNgay?fmtDate(x.h.denNgay):''
    ]);
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [22,16,14,14,18,14,14,20,32,18,14,16].map(w=>({wch:w}));
  ws['!merges'] = [{s:{r:0,c:0}, e:{r:0,c:header.length-1}}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'DaDonDi');
  XLSX.writeFile(wb, `DSDaDonDi_CanBaoXoaTamTru_187NSHL_${todayISO()}.xlsx`);
  showToast(`Đã xuất danh sách đã dọn đi (${list.length} người).`);
}

/* ============ ĐĂNG KÝ TẠM TRÚ CÔNG KHAI (link cho khách tự điền) ============ */
async function loadTamTruWindowStatus(){
  const el = document.getElementById('tamTruWindowStatus');
  if(!el) return;
  const url = (STATE.settings.sheetWebhookUrl||'').trim();
  if(!url){ el.innerHTML = '<div class="desc" style="margin:0;">Chưa cấu hình Google Sheet trong Cài đặt.</div>'; return; }
  try{
    const res = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'checkTamTruWindow'})});
    const text = await res.text();
    let json = null;
    try{ json = JSON.parse(text); }catch(e){}
    if(json && json.status==='ok'){
      STATE.tamTruWindowInfo = json;
      renderTamTruWindowStatus();
    } else {
      el.innerHTML = '<div class="desc" style="margin:0;">Không kiểm tra được trạng thái liên kết.</div>';
    }
  }catch(err){
    el.innerHTML = '<div class="desc" style="margin:0;">Lỗi: '+describeSyncError(err)+'</div>';
  }
}
function renderTamTruWindowStatus(){
  const el = document.getElementById('tamTruWindowStatus');
  const info = STATE.tamTruWindowInfo;
  if(!el || !info) return;
  if(info.open){
    const remainMs = Math.max(0, info.deadline - Date.now());
    const h = Math.floor(remainMs/3600000);
    const m = Math.floor((remainMs%3600000)/60000);
    el.innerHTML = `<div class="stat good" style="max-width:240px;"><div class="lbl">⏳ Link còn hiệu lực</div><div class="val" style="font-size:14px;">${h}h ${m}p · còn ${info.max-info.count}/${info.max} lượt</div></div>`;
  } else {
    el.innerHTML = `<div class="stat bad" style="max-width:200px;"><div class="lbl">Trạng thái link</div><div class="val" style="font-size:14px;">🔒 Đã đóng</div></div>`;
  }
}
let tamTruCountdownTimer = null;
function startTamTruCountdown(){
  if(tamTruCountdownTimer) clearInterval(tamTruCountdownTimer);
  tamTruCountdownTimer = setInterval(()=>{
    if(STATE.activeTab==='tamtru' && STATE.tamTruWindowInfo && STATE.tamTruWindowInfo.open){
      renderTamTruWindowStatus();
    } else if(STATE.activeTab!=='tamtru'){
      clearInterval(tamTruCountdownTimer);
    }
  }, 60000); // cập nhật mỗi phút — đủ cho đồng hồ đếm ngược, không cần gọi liên tục cho nhẹ
}
async function shareTamTruLink(){
  const url = (STATE.settings.sheetWebhookUrl||'').trim();
  if(!url){ showToast('Chưa cấu hình Google Sheet trong Cài đặt.'); return; }
  if(!STATE.tamTruWindowInfo || !STATE.tamTruWindowInfo.open){
    try{
      showToast('Đang mở lại liên kết đăng ký…');
      await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'openTamTruWindow'})});
      await loadTamTruWindowStatus();
    }catch(err){ showToast('Lỗi mở liên kết: '+describeSyncError(err)); return; }
  }
  const link = new URL('dangky.html', location.href).href;
  const shareData = {title:'Đăng ký tạm trú — Nhà Trọ 187', text:'Bạn vào link này điền giúp mình thông tin đăng ký tạm trú nhé:', url: link};
  if(navigator.share){
    try{ await navigator.share(shareData); return; }catch(err){ if(err && err.name==='AbortError') return; }
  }
  try{
    await navigator.clipboard.writeText(link);
    showToast('Đã copy link — dán vào Zalo để gửi cho khách.');
  }catch(err){
    showModal(`<h3>Link đăng ký</h3><div class="field"><input type="text" readonly value="${escapeAttr(link)}" onclick="this.select();"></div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Đóng</button></div>`);
  }
}

async function confirmPendingTamTru(id){
  const row = (STATE.tamTruPendingList||[]).find(x=>x.id===id);
  if(!row){ closeModal(); return; }
  const stt = Number(document.getElementById('cp_phong').value);
  const r = STATE.monthData.rooms.find(x=>x.stt===stt);
  if(!r){ showToast('Không tìm thấy phòng.'); return; }
  const occ = {
    id: 'occ_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    hoTen: document.getElementById('cp_hoten').value,
    soDienThoai: document.getElementById('cp_sdt').value,
    gioiTinh: document.getElementById('cp_gioitinh').value,
    ngaySinh: document.getElementById('cp_ngaysinh').value,
    ngheNghiep: document.getElementById('cp_nghe').value,
    cccd: document.getElementById('cp_cccd').value,
    ngayCapCccd: document.getElementById('cp_ngaycap').value,
    noiCapCccd: document.getElementById('cp_noicap').value,
    diaChiThuongTru: document.getElementById('cp_diachi').value,
    daDangKyTamTru: false,
    documents: {}
  };
  const types = giayToTypesList();
  if(row.cccdFileId && types.includes('CCCD')){ occ.documents['CCCD'] = [{fileId: row.cccdFileId, uploadedAt: Date.now()}]; }
  if(row.hopDongFileId && types.includes('Hợp đồng')){ occ.documents['Hợp đồng'] = [{fileId: row.hopDongFileId, uploadedAt: Date.now()}]; }
  if(!r.nguoiO) r.nguoiO = [];
  occ.laNguoiChinh = (r.nguoiO.length===0);
  r.nguoiO.push(occ);
  scheduleSave();

  const url = (STATE.settings.sheetWebhookUrl||'').trim();
  if(url){
    try{ await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'resolveTamTruPending', id, status:'confirmed'})}); }catch(err){}
  }
  STATE.tamTruPendingList = (STATE.tamTruPendingList||[]).filter(x=>x.id!==id);
  closeModal();
  renderMain();
  showToast('Đã thêm người vào phòng '+stt+'.');
}

function renderTamTruRows(){
  const tbody = document.getElementById('tamTruTbody');
  if(!tbody) return;
  let list = getAllOccupantsFlat();
  if(STATE.tamTruFilter==='yes') list = list.filter(x=>x.o.daDangKyTamTru);
  else if(STATE.tamTruFilter==='no') list = list.filter(x=>!x.o.daDangKyTamTru);

  const f = STATE.tamTruColFilters;
  const norm = s => String(s||'').toLowerCase();
  if(f.phong.trim()) list = list.filter(x=>String(x.r.stt).includes(f.phong.trim()));
  if(f.hoten.trim()) list = list.filter(x=>norm(x.o.hoTen).includes(norm(f.hoten)));
  if(f.ngaysinh.trim()) list = list.filter(x=>norm(x.o.ngaySinh?fmtDate(x.o.ngaySinh):'').includes(norm(f.ngaysinh)));
  if(f.gioitinh.trim()) list = list.filter(x=>norm(x.o.gioiTinh).includes(norm(f.gioitinh)));
  if(f.thuongtru.trim()) list = list.filter(x=>norm(x.o.diaChiThuongTru).includes(norm(f.thuongtru)));
  if(f.nghenghiep.trim()) list = list.filter(x=>norm(x.o.ngheNghiep).includes(norm(f.nghenghiep)));

  const showAddr = !!STATE.tamTruShowAddr;
  const colCount = showAddr ? 8 : 7;

  if(!list.length){
    tbody.innerHTML = `<tr><td colspan="${colCount}"><div class="empty-state">Không có ai khớp bộ lọc này.</div></td></tr>`;

function exportInputTemplate(){

function importInputTemplate(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
      let count = 0;
      for(let i=1;i<rows.length;i++){
        const row = rows[i];
        if(!row || !row.length) continue;
        const stt = Number(row[0]);
        if(!stt) continue;
        const idx = STATE.stagingRooms.findIndex(x=>x.stt===stt);
        if(idx<0) continue;
        const r = STATE.stagingRooms[idx];
        if(row[1]!=='' && row[1]!=null) r.gia = Number(row[1])||r.gia;
        if(row[2]!=='' && row[2]!=null) r.songuoi = Number(row[2])||r.songuoi;
        if(row[3]!=='' && row[3]!=null) r.soxe = Number(row[3])||r.soxe;
        if(row[4]!=='' && row[4]!=null) r.sodienmoi = Number(row[4]);
        if(r.waterMeter && row[5]!=='' && row[5]!=null) r.nuocMoi = Number(row[5]);
        count++;
      }
      renderMain();
      showToast(`Đã nhập xem trước cho ${count} phòng — kiểm tra rồi bấm "Xác nhận, đưa vào hệ thống".`);
    }catch(err){ showToast('File không đúng định dạng, vui lòng dùng đúng file mẫu.'); }
  };
  reader.readAsArrayBuffer(file);
}
async function confirmStagingApply(){
  STATE.stagingRooms.forEach(sr=>{
    const r = STATE.monthData.rooms.find(x=>x.stt===sr.stt);
    if(!r) return;
    r.gia = sr.gia; r.songuoi = sr.songuoi; r.soxe = sr.soxe; r.sodienmoi = sr.sodienmoi;
    if(r.waterMeter) r.nuocMoi = sr.nuocMoi;
  });
  await saveCurrentMonth();
  await refreshPrevDebts();
  showToast('Đã đưa dữ liệu vào hệ thống.');
  renderMain();
}

}
async function addGiayToType(){
  const input = document.getElementById('newGiayToType');
  const val = (input.value||'').trim();
  if(!val) return;
  if(!STATE.settings.giayToTypes) STATE.settings.giayToTypes = giayToTypesList().slice();
  if(STATE.settings.giayToTypes.includes(val)){ showToast('Loại này đã có rồi.'); return; }
  STATE.settings.giayToTypes.push(val);
  await stSetJSON('settings', STATE.settings);
  await touchLastModified();
  input.value = '';
  renderGiayToTypesList();
  showToast('Đã thêm loại giấy tờ.');
}
async function removeGiayToType(idx){
  if(!STATE.settings.giayToTypes) STATE.settings.giayToTypes = giayToTypesList().slice();
  STATE.settings.giayToTypes.splice(idx,1);
  await stSetJSON('settings', STATE.settings);
  await touchLastModified();
  renderGiayToTypesList();
  showToast('Đã xoá loại giấy tờ.');
}
function importTamTruExcel(file){
  if(!file) return;
  const statusEl = document.getElementById('tamTruImportStatus');
  const setStatus = (msg)=>{ if(statusEl) statusEl.textContent = msg; };
  setStatus('Đang đọc file…');
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
      const toISO = (v)=>{
        if(!v) return '';
        if(v instanceof Date) return v.toISOString().slice(0,10);
        return '';
      };
      // gom sẵn CCCD (11 số bên phải) của những người đã có, để so trùng
      const existingCCCD = new Set();
      STATE.monthData.rooms.forEach(r=>{
        (r.nguoiO||[]).forEach(o=>{
          const n = normalizeCCCD(o.cccd);
          if(n) existingCCCD.add(n);
        });
      });
      let count = 0, skipped = 0, trung = 0;
      for(let i=1;i<rows.length;i++){
        const row = rows[i];
        if(!row || !row.length) continue;
        const hoTen = row[0];
        if(!hoTen) continue;
        const stt = Number(row[2]);
        const r = STATE.monthData.rooms.find(x=>x.stt===stt);
        if(!r){ skipped++; continue; }
        const cccdRaw = String(row[4]||'');
        const cccdNorm = normalizeCCCD(cccdRaw);
        if(cccdNorm && existingCCCD.has(cccdNorm)){ trung++; continue; } // đã có người này rồi, bỏ qua tránh trùng
        if(!r.nguoiO) r.nguoiO = [];
        r.nguoiO.push({
          id: 'occ_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
          hoTen: String(hoTen),
          soDienThoai: String(row[1]||''),
          ngaySinh: toISO(row[3]),
          cccd: cccdRaw,
          daDangKyTamTru: String(row[5]||'').trim()==='Có',
          ngayCapCccd: toISO(row[6]),
          noiCapCccd: String(row[7]||''),
          diaChiThuongTru: String(row[8]||''),
          ngheNghiep: String(row[9]||''),
          gioiTinh: String(row[10]||''),
          documents: {}
        });
        if(cccdNorm) existingCCCD.add(cccdNorm); // tránh trùng luôn cả trong chính file đang import
        count++;
      }
      scheduleSave();
      renderMain();
      setStatus(`✅ Đã nhập ${count} người ở.${trung?` Bỏ qua ${trung} dòng trùng CCCD với người đã có.`:''}${skipped?` Bỏ qua ${skipped} dòng không khớp số phòng nào đang có.`:''}`);
      showToast(`Đã nhập ${count} người ở.`);
    }catch(err){
      setStatus('❌ File không đúng định dạng: '+(err&&err.message?err.message:err));
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ---- Sao lưu / phục hồi ảnh giấy tờ (đề phòng xoá nhầm ngoài 30 ngày trên Drive) ---- */
async function exportAllDocsBackup(){
  const statusEl = document.getElementById('docsBackupStatus');
  const setStatus = (msg)=>{ if(statusEl) statusEl.textContent = msg; };
  const url = (STATE.settings.sheetWebhookUrl||'').trim();
  if(!url){ showToast('Chưa cấu hình link Google Sheet/Apps Script.'); return; }
  const items = [];
  const pushDocs = (r, o, isHistory, historyIndex)=>{
    Object.keys(o.documents||{}).forEach(docType=>{
      let arr = o.documents[docType];
      if(!Array.isArray(arr)) arr = [arr];
      arr.forEach((d,idx)=>{
        items.push({stt:r.stt, occupantId:o.id, hoTen:o.hoTen, docType, idx, fileId:d.fileId, isHistory, historyIndex});
      });
    });
  };
  STATE.monthData.rooms.forEach(r=>{
    (r.nguoiO||[]).forEach(o=>pushDocs(r, o, false));
    (r.lichSuKhach||[]).forEach((h,hi)=>{ (h.nguoiO||[]).forEach(o=>pushDocs(r, o, true, hi)); });
  });
  if(!items.length){ showToast('Chưa có ảnh giấy tờ nào để sao lưu.'); return; }
  showToast(`Đang sao lưu ${items.length} ảnh, vui lòng đợi…`);
  const zip = new JSZip();
  const manifest = [];
  let done = 0;
  for(const it of items){
    setStatus(`Đang tải ảnh… (${done}/${items.length})`);
    try{
      const res = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'getDoc', fileId: it.fileId})});
      const text = await res.text();
      let json = null;
      try{ json = JSON.parse(text); }catch(e){}
      if(json && json.status==='ok' && json.base64){
        const ext = (json.mimeType||'image/jpeg').split('/')[1] || 'jpg';
        const path = `Phong_${it.stt}/${it.occupantId}__${it.docType}__${it.idx}.${ext}`;
        zip.file(path, json.base64, {base64:true});
        manifest.push(Object.assign({}, it, {path, mimeType: json.mimeType}));
      }
    }catch(err){ /* bỏ qua ảnh lỗi, tiếp tục ảnh khác */ }
    done++;
  }
  zip.file('manifest.json', JSON.stringify(manifest, null, 2));
  const content = await zip.generateAsync({type:'blob'});
  const urlBlob = URL.createObjectURL(content);
  const a = document.createElement('a'); a.href=urlBlob; a.download = `SaoLuu_GiayTo_187NSHL_${todayISO()}.zip`; a.click();
  URL.revokeObjectURL(urlBlob);
  setStatus(`✅ Đã sao lưu ${manifest.length}/${items.length} ảnh lúc ${fmtDate(todayISO())}.`);
  showToast(`Đã sao lưu xong ${manifest.length}/${items.length} ảnh.`);
}
async function importDocsBackup(file){
  if(!file) return;
  const statusEl = document.getElementById('docsBackupStatus');
  const setStatus = (msg)=>{ if(statusEl) statusEl.textContent = msg; };
  const url = (STATE.settings.sheetWebhookUrl||'').trim();
  if(!url){ showToast('Chưa cấu hình link Google Sheet/Apps Script.'); return; }
  setStatus('Đang đọc file sao lưu…');
  try{
    const zip = await JSZip.loadAsync(file);
    const manifestFile = zip.file('manifest.json');
    if(!manifestFile){ setStatus('❌ File .zip không đúng định dạng sao lưu (thiếu manifest.json).'); return; }
    const manifest = JSON.parse(await manifestFile.async('string'));
    let restored = 0, done = 0;
    for(const item of manifest){
      setStatus(`Đang phục hồi… (${done}/${manifest.length})`);
      done++;
      const imgFile = zip.file(item.path);
      if(!imgFile) continue;
      const base64 = await imgFile.async('base64');
      try{
        const res = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({
          action:'uploadDoc', roomStt:item.stt, base64Data: base64, mimeType:item.mimeType||'image/jpeg',
          fileName:`Phong${item.stt}_${item.docType}_${item.occupantId}_restore_${item.idx||0}.jpg`
        })});
        const text = await res.text();
        const json = JSON.parse(text);
        if(!(json && json.status==='ok')) continue;
        const r = STATE.monthData.rooms.find(x=>x.stt===item.stt);
        if(!r) continue;
        let target = (r.nguoiO||[]).find(x=>x.id===item.occupantId);
        if(!target && item.isHistory && r.lichSuKhach && r.lichSuKhach[item.historyIndex]){
          target = (r.lichSuKhach[item.historyIndex].nguoiO||[]).find(x=>x.id===item.occupantId);
        }
        if(target){
          if(!target.documents) target.documents = {};
          if(!target.documents[item.docType]) target.documents[item.docType] = [];
          if(!Array.isArray(target.documents[item.docType])) target.documents[item.docType] = [target.documents[item.docType]];
          target.documents[item.docType].push({fileId: json.fileId, uploadedAt: Date.now(), restored:true});
          restored++;
        }
      }catch(err){ /* bỏ qua ảnh lỗi, tiếp tục phục hồi ảnh còn lại */ }
    }
    scheduleSave();
    renderMain();
    setStatus(`✅ Đã phục hồi ${restored}/${manifest.length} ảnh.`);
    showToast(`Đã phục hồi ${restored}/${manifest.length} ảnh.`);
  }catch(err){
    setStatus('❌ Lỗi phục hồi: '+describeSyncError(err));
  }
}
async function saveSheetUrl(){
  STATE.settings.sheetWebhookUrl = (document.getElementById('s_sheeturl').value||'').trim();
  await stSetJSON('settings', STATE.settings);
  await touchLastModified();
  setCloudIndicator('', STATE.settings.sheetWebhookUrl ? 'Đã cấu hình' : 'Chưa đồng bộ');
  showToast('Đã lưu link Google Sheet.');
}
async function buildFullStatePayload(){
  const months = {};
  for(const mm of STATE.monthsIndex){
    months[mm.key] = mm.key===STATE.currentKey ? STATE.monthData : await stGetJSON('month:'+mm.key);
  }
  const authPassword = (await stGet('auth-password')) || DEFAULT_PASSWORD;
  const lastModified = Number(await stGet('last-modified')) || Date.now();
  return {
    action:'saveState',
    authPassword,
    settings: STATE.settings,
    monthsIndex: STATE.monthsIndex,
    activeMonth: STATE.currentKey,
    months,
    lastModified
  };
}
async function pushFullStateToSheet(){
  const url = (STATE.settings.sheetWebhookUrl||'').trim();
  const statusEl = document.getElementById('sheetSyncStatus');
  const setStatus = (msg)=>{ if(statusEl) statusEl.textContent = msg; };
  if(!url){ showToast('Chưa có link Google Sheet, hãy dán link rồi bấm "Lưu link" trước.'); return; }
  showToast('Đang đẩy toàn bộ dữ liệu lên Google Sheet…');
  setStatus('Đang gửi dữ liệu…');
  try{
    await saveCurrentMonth();
    const payload = await buildFullStatePayload();
    const res = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    const text = await res.text();
    let json = null;
    try{ json = JSON.parse(text); }catch(e){}
    if(json && json.status==='ok'){
      showToast('Đã đẩy toàn bộ dữ liệu lên Google Sheet thành công!');
      setStatus('✅ Đẩy dữ liệu thành công lúc '+fmtDate(todayISO()));
    } else {
      showToast('Gửi được nhưng phản hồi không như mong đợi — kiểm tra lại script.');
      setStatus('⚠️ Phản hồi bất thường: '+text.slice(0,200));
    }
  }catch(err){
    showToast('Không gửi được — xem chi tiết bên dưới.');
    setStatus('❌ '+describeSyncError(err));
  }
}
function pullFullStateFromSheet(){
  const url = (STATE.settings.sheetWebhookUrl||'').trim();

    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Hủy</button>
      <button class="btn btn-danger" onclick="closeModal(); doPullFullState();">Ghi đè, kéo về</button>

let _pendingRemoteState = null;
async function checkSyncStatus(){
  const statusEl = document.getElementById('sheetSyncStatus');
  const set = (msg)=>{ if(statusEl) statusEl.textContent = msg; };
  const localTime = Number(await stGet('last-modified'))||0;
  const localStr = localTime ? new Date(localTime).toLocaleString('vi-VN') : 'chưa có lần sửa nào';
  const localMonths = (STATE.monthsIndex||[]).length;
  const url = (STATE.settings.sheetWebhookUrl||'').trim();
  if(!url){ set(`📱 Máy này: ${localStr}, ${localMonths} tháng — chưa cấu hình link Google Sheet.`); return; }
  set(`📱 Máy này: ${localStr}, ${localMonths} tháng — đang kiểm tra Google Sheet…`);
  try{
    const res = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'loadState'})});
    const text = await res.text();
    let json = null;
    try{ json = JSON.parse(text); }catch(e){}
    if(json && json.status==='ok' && json.data){
      const remote = JSON.parse(json.data);
      const remoteTime = Number(remote.lastModified)||0;
      const remoteStr = remoteTime ? new Date(remoteTime).toLocaleString('vi-VN') : 'không rõ (Sheet chưa từng lưu qua bản mới)';
      const remoteMonths = Object.keys(remote.months||{}).length;
      set(`📱 Máy này: ${localStr}, ${localMonths} tháng  ·  ☁️ Google Sheet: ${remoteStr}, ${remoteMonths} tháng`);
    } else {
      set(`📱 Máy này: ${localStr}, ${localMonths} tháng  ·  ☁️ Sheet chưa có dữ liệu hoặc phản hồi lạ: ${text.slice(0,150)}`);
    }
  }catch(err){
    set(`📱 Máy này: ${localStr}, ${localMonths} tháng  ·  ☁️ Lỗi kiểm tra Sheet: ${describeSyncError(err)}`);
  }
}
async function checkRemoteForNewerData(){
  const url = (STATE.settings && STATE.settings.sheetWebhookUrl || '').trim();
  if(!url) return;
  try{
    const res = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'loadState'})});
    const text = await res.text();
    let json = null;
    try{ json = JSON.parse(text); }catch(e){}
    if(!(json && json.status==='ok' && json.data)) return;
    const remote = JSON.parse(json.data);
    const remoteTime = Number(remote.lastModified)||0;
    const localTime = Number(await stGet('last-modified'))||0;
    if(remoteTime > localTime + 5000){ // chừa vài giây tránh lệch đồng hồ vặt
      _pendingRemoteState = remote;
      showNewerDataModal(remoteTime);
    }
  }catch(err){
    // âm thầm bỏ qua — không làm phiền lúc đăng nhập nếu không kết nối được
  }
}
function showNewerDataModal(remoteTime){
  const timeStr = new Date(remoteTime).toLocaleString('vi-VN');
  showModal(`
    <h3>☁️ Có dữ liệu mới hơn</h3>
    <div class="desc">Google Sheet đang có dữ liệu được cập nhật lúc <b>${timeStr}</b> — mới hơn dữ liệu trên máy này (có thể do bạn vừa sửa ở thiết bị khác). Tải bản mới về? (Dữ liệu trên máy này sẽ bị thay thế)</div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="_pendingRemoteState=null; closeModal();">Bỏ qua, dùng bản trên máy này</button>
      <button class="btn btn-primary" onclick="applyPendingRemoteState()">Tải bản mới về</button>
    </div>
  `);
}
async function applyPendingRemoteState(){
  const state = _pendingRemoteState;
  if(!state){ closeModal(); return; }
  await absorbRemoteState(state);
  _pendingRemoteState = null;
  closeModal();
  showToast('Đã tải dữ liệu mới nhất — đang tải lại…');
  setTimeout(()=>loadAll(), 500);
}
async function absorbRemoteState(state){
  await stSet('auth-password', state.authPassword||DEFAULT_PASSWORD);
  const settings = Object.assign({}, DEFAULT_SETTINGS, state.settings||{});
  if(!settings.sheetWebhookUrl){ settings.sheetWebhookUrl = (STATE.settings&&STATE.settings.sheetWebhookUrl)||''; }
  await stSetJSON('settings', settings);
  await stSetJSON('months-index', state.monthsIndex||[]);
  const months = state.months||{};
  for(const k in months){ await stSetJSON('month:'+k, months[k]); }
  if(state.activeMonth){ await stSet('active-month', state.activeMonth); }
  await stSet('last-modified', String(state.lastModified||Date.now()));
}
async function doPullFullState(){
  const url = (STATE.settings.sheetWebhookUrl||'').trim();
  const statusEl = document.getElementById('sheetSyncStatus');
  const setStatus = (msg)=>{ if(statusEl) statusEl.textContent = msg; };
  showToast('Đang tải dữ liệu từ Google Sheet…');
  try{
    const res = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'loadState'})});
    const text = await res.text();
    let json = null;
    try{ json = JSON.parse(text); }catch(e){}
    if(json && json.status==='ok' && json.data){
      const state = JSON.parse(json.data);
      await absorbRemoteState(state);
      showToast('Đã kéo dữ liệu mới nhất về — đang tải lại…');
      setStatus('✅ Đã kéo về lúc '+fmtDate(todayISO()));
      setTimeout(()=>loadAll(), 800);
    } else {
      showToast('Không có dữ liệu trên Sheet, hoặc phản hồi lỗi.');
      setStatus('⚠️ Không lấy được dữ liệu: '+text.slice(0,200));
    }
  }catch(err){
    showToast('Không tải được — xem chi tiết bên dưới.');
    setStatus('❌ '+describeSyncError(err));
  }
}
